<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ziyarat</title>
<meta name="theme-color" content="#6b1824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hijri Cal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="themes.css?v=52">
<script src="theme-init.js?v=52"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:var(--hdr-ink);padding:calc(env(safe-area-inset-top) + 8px) 10px 10px}
.hrow{display:flex;align-items:center;gap:6px}
header a{color:inherit;text-decoration:none;font-size:26px;width:40px;height:40px;display:grid;place-items:center}
header b{flex:1;font-size:17px}
#q{width:100%;margin-top:8px;font:inherit;border:0;border-radius:10px;padding:9px 12px;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;border:0;border-radius:10px;padding:8px;font:inherit;font-size:13px;font-weight:600;background:var(--hdr-chip);color:var(--hdr-ink)}
.tabs button.on{background:#fff;color:var(--hdr-on)}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 24px)}
.grp{margin:16px 4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0;font-size:16px}
.city{color:var(--brand);font-weight:700;font-size:13px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:middle}
.ppl{margin:6px 0 0;padding-left:18px;font-size:13px}
.ppl li{margin:1px 0}
.addr{color:var(--muted);font-size:12px;margin-top:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns a{text-decoration:none;font-size:13px;font-weight:600;padding:7px 11px;border-radius:10px;background:var(--chip);color:var(--ink)}
.btns a.call{background:var(--brand);color:var(--on-brand)}
.dai{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 6px;border-top:1px solid var(--line);align-items:start}
.dai:first-child{border-top:0}
.dai .n{position:relative;width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:400;font-size:18px;font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif}
.dai .n i{position:absolute;right:-6px;bottom:-5px;font-style:normal;font-size:12px;line-height:1}
.dai.yem{border-left:3px solid var(--gold);padding-left:4px}
.dai.cur{background:color-mix(in srgb,var(--brand) 10%,transparent);border-radius:12px;border:1px solid var(--brand)}
.dai.cur .n{background:var(--brand);color:var(--on-brand)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px;padding:0 4px}
.dai .r{color:var(--muted);font-size:12px}
.dai a{color:var(--brand);font-size:12px;font-weight:600}
.note{color:var(--muted);font-size:11px;margin:14px 4px}
.note a{color:var(--brand)}
.hide{display:none}
</style>
</head>
<body>
<header>
  <div class="hrow"><a href="./#dua" aria-label="Back">‹</a><b id="title">Ziyarat</b></div>
  <input id="q" type="search" autocomplete="off">
  <div class="tabs"><button data-t="m" class="on" id="tM"></button><button data-t="d" id="tD"></button></div>
</header>
<main>
  <div id="vm"></div>
  <div id="vd" class="hide"><div class="card" id="dl"></div></div>
  <p class="note" id="note"></p>
</main>
<script src="i18n.js?v=52"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } } };
const L = I18N[ls.get("lang", "en")] || I18N.en;
const t = (k, v = {}) => String(L[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let D = null, tab = "m";

function render() {
  const q = $("q").value.trim().toLowerCase();
  const hit = s => !q || s.toLowerCase().includes(q);
  // Mazaraat, grouped by country
  const byMz = {};
  D.dais.forEach(d => { if (d.mz) (byMz[d.mz] = byMz[d.mz] || []).push(d); });
  let html = "", last = "";
  D.mazaraat.forEach(m => {
    const dais = byMz[m.id] || [];
    const people = m.people.length ? m.people : dais.map(d => `${d.no}${ord(d.no)} Dai — Syedna ${d.name}`);
    const daiLine = dais.length ? `<div class="r" style="font-size:12px;margin-top:6px"><b>${t("zTabD")}:</b> ${dais.map(d => d.no).join(", ")}</div>` : "";
    const text = [m.name, m.city, m.address, ...people, ...dais.map(d => d.name)].join(" ");
    if (!hit(text)) return;
    if (m.country !== last) { html += `<div class="grp">${esc(m.country)}</div>`; last = m.country; }
    const tel = m.phone ? m.phone.replace(/[^\d+]/g, "") : "";
    html += `<div class="card" id="${m.id}"><div class="city">${esc(m.city)}${m.kind === "faiz" ? `<span class="tag">${t("zFaiz")}</span>` : ""}</div>
      <h3>${esc(m.name)}</h3>
      ${people.length ? `<div class="r" style="font-size:12px;color:var(--muted);margin-top:4px">${t("zResting")}</div><ul class="ppl">${people.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      ${daiLine}
      ${m.address ? `<div class="addr">📍 ${esc(m.address)}</div>` : ""}
      <div class="btns">${tel ? `<a class="call" href="tel:${tel}">📞 ${esc(m.phone)}</a>` : ""}<a href="${esc(m.maps)}" target="_blank" rel="noopener">🗺 ${t("zMap")}</a><a href="${esc(m.src)}" target="_blank" rel="noopener">🔗 ${t("zSrc")}</a></div></div>`;
  });
  $("vm").innerHTML = html || `<p class="note">—</p>`;
  // Duat Mutlaqeen
  const ARD = "٠١٢٣٤٥٦٧٨٩", arNum = n => String(n).replace(/\d/g, c => ARD[c]);
  const mark = d => d.current ? "⭐" : d.mz ? "🕌" : d.yemen ? "🇾🇪" : "";
  $("dl").innerHTML = `<div class="legend"><span>⭐ ${t("zCur")}</span><span>🕌 ${t("zHasMz")}</span><span>🇾🇪 ${t("zYemenKey")}</span></div>` +
    D.dais.filter(d => hit(`${d.no} ${d.name} ${d.rest}`)).map(d => `<div class="dai ${d.current ? "cur" : d.yemen ? "yem" : ""}"><span class="n">${arNum(d.no)}${mark(d) ? `<i>${mark(d)}</i>` : ""}</span><div><b>Syedna ${esc(d.name)}</b>
    <div class="r">${esc(d.period)}${d.current ? ` · <b>${t("zCur")}</b>` : ` · ${t("zRest")}: ${esc(d.rest)}`}${d.yemen ? ` <span class="tag">${t("zYemen")}</span>` : ""}</div>
    ${d.mz ? `<a href="#${d.mz}" data-goto="${d.mz}">→ ${t("zSeeMz")}</a>` : ""}</div></div>`).join("") || "—";
}
const ord = n => (n % 100 >= 11 && n % 100 <= 13) ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
function setTab(x) {
  tab = x; $("tM").classList.toggle("on", x === "m"); $("tD").classList.toggle("on", x === "d");
  $("vm").classList.toggle("hide", x !== "m"); $("vd").classList.toggle("hide", x !== "d");
}
document.querySelector(".tabs").onclick = e => { const b = e.target.closest("[data-t]"); if (b) setTab(b.dataset.t); };
document.addEventListener("click", e => {
  const a = e.target.closest("[data-goto]"); if (!a) return;
  e.preventDefault(); $("q").value = ""; render(); setTab("m");
  const el = $(a.dataset.goto); if (el) { el.scrollIntoView({ block: "start" }); scrollBy(0, -150); el.style.outline = "2px solid var(--brand)"; setTimeout(() => el.style.outline = "", 2000); }
});
$("q").oninput = render;
$("title").textContent = "🕌 " + t("zH");
$("q").placeholder = t("zSearch");
$("tM").textContent = t("zTabM"); $("tD").textContent = t("zTabD");
fetch("ziyarat.json").then(r => r.json()).then(j => {
  D = j; render();
  $("note").innerHTML = t("zNote", { d: esc(j.updated) }) + ` <a href="https://zaereen.com/mazaraat/" target="_blank" rel="noopener">zaereen.com</a> · <a href="https://en.wikipedia.org/wiki/List_of_Dai_of_the_Dawoodi_Bohra" target="_blank" rel="noopener">Wikipedia</a>`;
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
</script>
</body>
</html>
