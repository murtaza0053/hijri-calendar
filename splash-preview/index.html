<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splash options</title>
<style>body{margin:0;padding:14px;background:#111;color:#ddd;font:14px system-ui}h1{font-size:16px}

.p b{position:absolute;left:0;right:0;text-align:center;color:#e6bd63;font:600 11px/1 system-ui;letter-spacing:.35em}
.l{margin-top:6px;text-align:center;color:#bbb}
.hr{position:absolute;left:50%;width:26%;transform:translateX(-50%);height:1px;background:linear-gradient(90deg,transparent,#e6bd63,transparent)}
</style></head><body><h1>Opening screen options (temporary)</h1><div class="g">

<div><div class="p rad"><img src="cal_grad.png" style="top:30%;width:74%"><div class="hr" style="top:68%"></div><img src="logo.png" style="top:72%;width:26%"></div><div class="l">B. Sirf calligraphy bich me, logo neeche chhota</div></div>
<div><div class="p rad"><img src="logo.png" style="top:27%;width:42%"><img src="cal_grad.png" style="top:52%;width:46%"><b style="top:80%">MUMIN</b></div><div class="l">C. Logo + calligraphy (gradient) + naam "MUMIN"</div></div>
</div></body></html>
