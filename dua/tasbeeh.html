<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tasbeeh</title>
<meta name="theme-color" content="#6b1824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hijri Cal">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../themes.css?v=53">
<script src="../theme-init.js?v=53"></script>
<style>
@font-face{font-family:"QNaskh";src:url(fonts/NotoNaskhArabic-arabic.woff2) format("woff2");font-weight:400 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--hdr);color:var(--hdr-ink)}
header a{color:inherit;text-decoration:none;font-size:26px;width:40px;height:40px;display:grid;place-items:center}
header b{flex:1;font-size:16px}
.tabs{display:flex;gap:4px;padding:10px 12px 0;max-width:560px;margin:0 auto;width:100%}
.tabs button{flex:1;min-width:0;border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:9px 4px;border-radius:10px}
.tabs button.on{background:var(--brand);color:var(--on-brand)}
#tap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;cursor:pointer;touch-action:manipulation}
.zikr-ar{font-family:QNaskh,"Geeza Pro",serif;font-size:34px;line-height:1.6;text-align:center;direction:rtl;color:var(--brand)}
.zikr-en{color:var(--muted);font-size:14px;text-align:center;min-height:20px;max-width:520px}
.ring{position:relative;width:min(68vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--brand);transition:stroke-dashoffset .15s}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n b{font-size:64px;font-variant-numeric:tabular-nums;line-height:1}
.ring .n span{color:var(--muted);font-size:14px;margin-top:4px}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)} .steps i.sd{background:var(--gold)} .steps i.sc{background:var(--brand)}
.hint{color:var(--muted);font-size:12px}
.done{color:var(--gold);font-weight:700;font-size:18px;min-height:24px}
#foot{display:flex;justify-content:space-between;align-items:center;padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);gap:8px}
#foot button{border:0;background:var(--chip);color:var(--ink);font:inherit;font-weight:600;padding:10px 16px;border-radius:12px}
#total{color:var(--muted);font-size:13px}
.pulse{animation:p .18s}
@keyframes p{50%{transform:scale(.97)}}
#chartBtn{margin-left:auto;width:40px;height:46px;padding:0;border:2px solid var(--hdr-chip);border-radius:8px;overflow:hidden;background:#f3ead8;flex:none}
#chartBtn img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
#chartView{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 50px) 10px calc(env(safe-area-inset-bottom) + 20px)}
#chartView.on{display:block}
#chartView img{display:block;width:100%;max-width:600px;margin:0 auto;border-radius:10px}
#chartView button{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:40px;height:40px;border-radius:20px;border:0;font-size:22px;background:rgba(255,255,255,.9);color:#000}
</style>
</head>
<body>
<header><a href="../#dua" aria-label="Back">‹</a><b id="title"></b><button id="chartBtn" aria-label="Tasbih of 7 days chart"><img src="img/tasbih-7-days.jpg" alt=""></button></header>
<div id="chartView"><button aria-label="Close">×</button><img src="img/tasbih-7-days.jpg" alt="Tasbih of 7 days"></div>
<div class="tabs" id="tabs"></div>
<div id="tap">
  <div class="zikr-ar" id="ar"></div>
  <div class="zikr-en" id="en"></div>
  <div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44" fill="none" stroke-width="6"/><circle class="fg" id="arc" cx="50" cy="50" r="44" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="276.46"/></svg>
    <div class="n"><b id="count">0</b><span id="of"></span></div></div>
  <div class="steps" id="steps"></div>
  <div class="done" id="done"></div>
  <div class="hint" id="hint"></div>
</div>
<div id="foot"><button id="undo">−1</button><span id="total"></span><button id="reset"></button></div>
<script src="../i18n.js?v=53"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const L = I18N[ls.get("lang", "en")] || I18N.en;
const t = (k, v = {}) => String(L[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const WEEK = [
  { ar: "اِيَّاكَ نَعۡبُدُ وَاِيَّاكَ نَسۡتَعِيۡنُ", en: "Iyyaka Na'budu Wa Iyyaka Nasta'een", m: "You alone we worship and You alone we ask for help" },
  { ar: "يَا غَفُوۡرُ يَا رَحِيۡمُ", en: "Ya Ghafoor, Ya Raheem", m: "O Most Forgiving, O Most Merciful" },
  { ar: "سُبۡحَانَ اللّٰهِ وَالۡحَمۡدُ لِلّٰهِ", en: "SubhanAllahi wal Hamdu Lillah", m: "Glory be to Allah, and all praise is for Allah" },
  { ar: "يَا رَحۡمٰنُ يَا رَحِيۡمُ", en: "Ya Rahman, Ya Raheem", m: "O Most Gracious, O Most Merciful" },
  { ar: "حَسۡبُنَا اللّٰهُ وَنِعۡمَ الۡوَكِيۡلُ", en: "HasbunAllahu Wa Ni'mal Wakeel", m: "Allah is sufficient for us, and He is the best disposer of affairs" },
  { ar: "يَا ذَا الۡجَلَالِ وَالۡاِكۡرَامِ", en: "Ya Zal Jalali Wal Ikram", m: "O Lord of Majesty and Honour" },
  { ar: "يَا حَيُّ يَا قَيُّوۡمُ", en: "Ya Hayyu, Ya Qayyum", m: "O Ever-Living, O Sustainer of all" }];
const wk = WEEK[new Date().getDay()];
// salawaat text as printed in the Bohra Dua al-Jawahir (user's PDF)
const PRESETS = {
  week: { name: "tToday", steps: [{ ar: wk.ar, en: wk.en + " — " + wk.m, n: 100 }] },
  salawaat: { name: "tSalawaat", steps: [{ ar: "اَللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ وَّعَلٰى اٰلِ مُحَمَّدٍ وَّبَارِكۡ وَسَلِّمۡ", en: "Allahumma salle ala Mohammadin wa ala aale Mohammadin wa baarik wa sallim", n: 1000 }] },
};
const today = new Date().toISOString().slice(0, 10);
let st = ls.get("tasbeeh", { mode: "week", step: 0, c: 0, round: 1, day: today, total: 0 });
if (!PRESETS[st.mode]) { st.mode = "week"; st.step = 0; st.c = 0; st.round = 1; }  // e.g. the removed Tasbeeh-e-Fatema / own zikr
if (st.day !== today) { st.day = today; st.total = 0; if (st.mode === "week") { st.step = 0; st.c = 0; st.round = 1; } }
const qm = new URLSearchParams(location.search).get("m");
if (qm && PRESETS[qm] && qm !== st.mode) { st.mode = qm; st.step = 0; st.c = 0; st.round = 1; }
const save = () => ls.set("tasbeeh", st);
const steps = () => PRESETS[st.mode].steps;

function render(pulse) {
  $("title").textContent = t("weekH");
  $("tabs").innerHTML = Object.keys(PRESETS).map(k => `<button data-m="${k}" class="${k === st.mode ? "on" : ""}">${t(PRESETS[k].name)}</button>`).join("");
  const S = steps(), s = S[Math.min(st.step, S.length - 1)], finished = st.step >= S.length;
  $("ar").textContent = s.ar; $("en").textContent = s.en;
  $("count").textContent = finished ? s.n || st.c : st.c;
  $("of").textContent = s.n ? "/ " + s.n : t("tFree");
  const frac = s.n ? (finished ? 1 : st.c / s.n) : (st.c % 100) / 100;
  $("arc").style.strokeDashoffset = 276.46 * (1 - frac);
  $("steps").innerHTML = S.length > 1 ? S.map((_, i) => `<i class="${i < st.step ? "sd" : i === st.step ? "sc" : ""}"></i>`).join("") : "";
  $("done").textContent = finished ? t("tDone") : (st.round > 1 ? t("tRound", { n: st.round }) : "");
  $("hint").textContent = t("tTapHint");
  $("total").textContent = t("tTotal", { n: st.total });
  $("reset").textContent = t("tReset");
  if (pulse) { const r = document.querySelector(".ring"); r.classList.remove("pulse"); void r.offsetWidth; r.classList.add("pulse"); }
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
function inc() {
  const S = steps();
  if (st.step >= S.length) { st.step = 0; st.c = 0; st.round++; }  // tap after completion starts the next round
  st.c++; st.total++;
  const n = S[st.step].n;
  if (n && st.c >= n) {
    st.step++; buzz([60, 40, 60]);
    if (st.step < S.length) st.c = 0;
  } else buzz(12);
  save(); render(true);
}
$("tap").addEventListener("pointerdown", e => { e.preventDefault(); inc(); });
$("undo").onclick = () => { if (st.c > 0) { st.c--; st.total = Math.max(0, st.total - 1); } else if (st.step > 0) { st.step--; st.c = Math.max(0, steps()[st.step].n - 1); st.total = Math.max(0, st.total - 1); } save(); render(); };
$("reset").onclick = () => { st.step = 0; st.c = 0; st.round = 1; save(); render(); };
$("tabs").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; st.mode = b.dataset.m; st.step = 0; st.c = 0; st.round = 1; save(); render(); };
$("chartBtn").onclick = () => $("chartView").classList.add("on");
$("chartView").onclick = e => { if (e.target.tagName !== "IMG") $("chartView").classList.remove("on"); };
render();
if ("serviceWorker" in navigator) {
  // updateViaCache:none + update() on every resume = new versions arrive fast; reload once when a new worker takes over
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") r.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
