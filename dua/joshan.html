<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dua e Joshan</title>
<meta name="theme-color" content="#6b1824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mumin">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../themes.css?v=116">
<script src="../theme-init.js?v=116"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--hdr);color:var(--hdr-ink);padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.hrow{display:flex;align-items:center;gap:6px}
header a{color:inherit;text-decoration:none;font-size:26px;width:40px;height:40px;display:grid;place-items:center}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:16px}
header .tt span{display:block;font-size:12px;opacity:.85}
.days{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:0;border-radius:16px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;background:var(--hdr-chip);color:var(--hdr-ink)}
.days button.on{background:#fff;color:var(--hdr-on)}
.days button.today::after{content:" •"}
main{padding:calc(env(safe-area-inset-top) + 118px) 10px calc(env(safe-area-inset-bottom) + 30px);max-width:760px;margin:0 auto}
.pg{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px;margin:0 0 10px;min-height:260px}
.note{color:var(--muted);font-size:11px;margin:12px 4px}
.note a{color:var(--brand)}
</style>
</head>
<body>
<header>
  <div class="hrow"><a href="../#dua" aria-label="Back">‹</a><div class="tt"><b id="title"></b><span id="sub"></span></div></div>
  <div class="days" id="days"></div>
</header>
<main>
  <div id="pages"></div>
  <p class="note" id="note"></p>
</main>
<script src="../i18n.js?v=116"></script>
<script src="../wakelock.js?v=116"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } } };
const L = I18N[ls.get("lang", "en")] || I18N.en;
const t = (k, v = {}) => String(L[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
// Dua e Joshan is a different dua for each weekday (Sunday … Saturday): first and last page of the printed book scan
const SRC = "https://dawoodibohraapp.com/";
const PG = n => `${SRC}Duas/pdf/Dua%20Joshan/Dua_Joshan-${String(n).padStart(2, "0")}-min.png`;
const DAYS = [[1, 7], [8, 15], [16, 24], [25, 34], [35, 45], [46, 56], [57, 68]];   // Sun … Sat
const today = new Date().getDay();
const q = new URLSearchParams(location.search).get("d");
let day = q != null && /^[0-6]$/.test(q) ? +q : today;
document.title = t("joshanH");
$("days").innerHTML = DAYS.map((_, d) => `<button data-d="${d}" class="${d === today ? "today" : ""}">${L.wd[d]}</button>`).join("");
function show(d) {
  day = d;
  document.querySelectorAll("#days button").forEach(b => b.classList.toggle("on", +b.dataset.d === d));
  $("title").textContent = "🤲 " + t("joshanH") + " — " + L.wd[d];
  $("sub").textContent = (d === today ? t("today") + " · " : "") + t("joshanPages", { a: DAYS[d][0], b: DAYS[d][1] - DAYS[d][0] + 1 });
  let h = "";
  for (let n = DAYS[d][0]; n <= DAYS[d][1]; n++) h += `<img class="pg" src="${PG(n)}" alt="${L.wd[d]} ${n}" ${n > DAYS[d][0] + 1 ? 'loading="lazy"' : ""}>`;
  $("pages").innerHTML = h; scrollTo(0, 0);
  const b = document.querySelector(`#days button[data-d="${d}"]`); if (b) b.scrollIntoView({ inline: "center", block: "nearest" });
}
$("days").onclick = e => { const b = e.target.closest("[data-d]"); if (b) show(+b.dataset.d); };
$("note").innerHTML = t("joshanNote") + ` <a href="${SRC}joshan.html" target="_blank" rel="noopener">dawoodibohraapp.com</a>`;
show(day);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
</script>
</body>
</html>
