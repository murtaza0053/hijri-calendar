<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dua e Joshan</title>
<meta name="theme-color" content="#6b1824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mumin">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../themes.css?v=84">
<script src="../theme-init.js?v=84"></script>
<style>
@font-face{font-family:"AmiriQuran";src:url(fonts/AmiriQuran-arabic.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"QNaskh";src:url(fonts/NotoNaskhArabic-arabic.woff2) format("woff2");font-weight:400 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--hdr);color:var(--hdr-ink)}
header a,header button{color:inherit;text-decoration:none;font-size:26px;width:40px;height:40px;display:grid;place-items:center;background:none;border:0;padding:0;font-family:inherit}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:16px}
header .tt span{display:block;font-size:12px;opacity:.85}
header button.s{font-size:15px;font-weight:700;width:36px}
main{padding:calc(env(safe-area-inset-top) + 72px) 12px calc(env(safe-area-inset-bottom) + 40px);max-width:760px;margin:0 auto}
.intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.bar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.bar button,.bar select{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:9px 12px;background:var(--brand);color:var(--on-brand)}
.bar select{background:var(--chip);color:var(--ink);flex:1;min-width:120px}
.fs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px;position:relative;scroll-margin-top:calc(env(safe-area-inset-top) + 72px)}
.fs.here{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 35%,transparent)}
.fs .n{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--brand);color:var(--on-brand);font-family:"Geeza Pro","Noto Naskh Arabic","Segoe UI",sans-serif;font-size:17px;line-height:1}
.fs .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;color:var(--muted);font-size:12px}
.fs .t{font-family:AmiriQuran,QNaskh,"Geeza Pro",serif;font-size:var(--fz,26px);line-height:2.05;direction:rtl;text-align:justify;text-align-last:center}
.fs .ref{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-family:AmiriQuran,QNaskh,"Geeza Pro",serif;font-size:calc(var(--fz,26px)*.78);line-height:1.9;direction:rtl;text-align:center;color:#8a6a1c}
html.dark .fs .ref{color:#d9b25a}
.note{color:var(--muted);font-size:11px;margin:14px 4px}
</style>
</head>
<body>
<header>
  <a href="../#dua" aria-label="Back">‹</a>
  <div class="tt"><b id="title"></b><span id="sub"></span></div>
  <button class="s" id="fm" aria-label="Smaller">A−</button><button class="s" id="fp" aria-label="Bigger">A+</button>
</header>
<main>
  <div class="intro" id="intro"></div>
  <div class="bar"><select id="jump"></select><button id="cont" hidden></button></div>
  <div id="list"></div>
  <p class="note" id="note"></p>
</main>
<script src="../i18n.js?v=84"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const L = I18N[ls.get("lang", "en")] || I18N.en;
const t = (k, v = {}) => String(L[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const AR = "٠١٢٣٤٥٦٧٨٩", ar = n => String(n).replace(/\d/g, c => AR[c]);
let D = null, here = ls.get("joshanHere", 0), fz = ls.get("joshanFz", 26);
document.title = t("joshanH"); $("title").textContent = "🤲 " + t("joshanH"); $("sub").textContent = t("joshanSub");
$("intro").innerHTML = t("joshanIntro");
function setFz() { document.documentElement.style.setProperty("--fz", fz + "px"); ls.set("joshanFz", fz); }
$("fm").onclick = () => { fz = Math.max(18, fz - 2); setFz(); };
$("fp").onclick = () => { fz = Math.min(44, fz + 2); setFz(); };
setFz();
function mark(n) {
  here = n; ls.set("joshanHere", n);
  document.querySelectorAll(".fs.here").forEach(e => e.classList.remove("here"));
  const el = $("f" + n); if (el) el.classList.add("here");
  $("cont").hidden = !n; $("cont").textContent = t("joshanCont", { n: ar(n) });
}
function go(n) { const el = $("f" + n); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
fetch("joshan.json").then(r => r.json()).then(j => {
  D = j;
  $("list").innerHTML = j.fasl.map(f => `<div class="fs" id="f${f.n}" data-n="${f.n}"><div class="top"><span class="n">${ar(f.n)}</span><span>${t("joshanTap")}</span></div><div class="t">${f.t}</div><div class="ref">${j.refrain}</div></div>`).join("");
  $("jump").innerHTML = `<option value="">${t("joshanJump")}</option>` + j.fasl.map(f => `<option value="${f.n}">${ar(f.n)}</option>`).join("");
  $("note").textContent = t("joshanNote");
  mark(here);
  if (here) setTimeout(() => go(here), 150);
});
$("list").onclick = e => { const c = e.target.closest(".fs"); if (c) mark(+c.dataset.n); };
$("jump").onchange = e => { if (e.target.value) go(+e.target.value); e.target.value = ""; };
$("cont").onclick = () => go(here);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
</script>
</body>
</html>
