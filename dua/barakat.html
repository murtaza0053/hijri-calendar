<style>
@font-face{font-family:"AmiriQ";src:url(fonts/AmiriQuran-arabic.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:var(--hdr-ink);padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;gap:6px}
header a{color:inherit;text-decoration:none;font-size:26px;width:40px;height:40px;display:grid;place-items:center}
header b{flex:1;font-size:18px;letter-spacing:.2px}
#q{width:100%;margin-top:8px;font:inherit;font-size:16px;border:0;border-radius:14px;padding:11px 14px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;border-radius:20px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;background:var(--hdr-chip);color:var(--hdr-ink);white-space:nowrap}
.chips button.on{background:#fff;color:var(--hdr-on,var(--brand));box-shadow:0 2px 8px rgba(0,0,0,.2)}
main{max-width:640px;margin:0 auto;padding:14px 12px calc(env(safe-area-inset-bottom) + 40px)}
.sec{margin:18px 6px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border-radius:20px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05);overflow:hidden;border:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--brand) 12%,transparent)}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:15.5px;line-height:1.25}
.tt small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{flex:none;min-width:46px;text-align:center;padding:5px 10px;border-radius:12px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px}
.cnt.d{background:color-mix(in srgb,var(--gold,#c9962b) 90%,#000);}
.cnt.i{background:var(--chip);color:var(--muted)}
.chev{flex:none;color:var(--muted);font-size:20px;transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.cb{display:none;padding:2px 16px 18px;border-top:1px dashed var(--line)}
.card.open .cb{display:block}
.ar{font-family:IndoPak,AmiriQ,"Noto Naskh Arabic","Geeza Pro",serif;direction:rtl;text-align:center;font-size:30px;line-height:2.15;color:var(--ink);margin:14px 0 6px;-webkit-text-stroke:.25px currentColor;word-spacing:.05em}
.ar.sm{font-size:25px}
.tr{font-style:italic;color:var(--muted);text-align:center;font-size:14px;line-height:1.5;margin:4px 6px 10px}
.nt{background:color-mix(in srgb,var(--brand) 7%,transparent);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:8px 0;line-height:1.45}
.nt b{color:var(--brand)}
.days{margin:10px 0}
.days div{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px}
.days div.today{background:color-mix(in srgb,var(--brand) 14%,transparent);box-shadow:inset 0 0 0 1.5px var(--brand)}
.days span{flex:none;width:68px;font-size:12.5px;font-weight:700;color:var(--muted)}
.days i{flex:1;font-style:normal;font-family:IndoPak,AmiriQ,serif;direction:rtl;text-align:center;font-size:23px;line-height:1.9;-webkit-text-stroke:.2px currentColor}
ol.deeds{margin:10px 0 0;padding:0;list-style:none;counter-reset:d}
ol.deeds li{counter-increment:d;position:relative;padding:8px 8px 8px 44px;margin:6px 0;border-radius:14px;background:color-mix(in srgb,var(--brand) 6%,transparent);font-size:14px}
ol.deeds li::before{content:counter(d);position:absolute;left:10px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:13px}
ol.deeds li small{display:block;color:var(--muted);margin-top:2px}
.ctr{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.ctr button.rs{border:0;background:var(--chip);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:18px}
.tap{position:relative;width:124px;height:124px;border:0;background:none;padding:0;touch-action:manipulation;color:var(--ink)}
.tap svg{width:100%;height:100%;transform:rotate(-90deg)}
.tap .bg{fill:color-mix(in srgb,var(--brand) 6%,var(--card));stroke:var(--line);stroke-width:8}
.tap .fg{fill:none;stroke:var(--brand);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .12s}
.tap .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tap .n b{font-size:34px;font-variant-numeric:tabular-nums}
.tap .n span{font-size:12px;color:var(--muted)}
.tap:active{transform:scale(.97)}
.tap.done .fg{stroke:var(--gold,#c9962b)}
.dn{text-align:center;color:var(--gold,#c9962b);font-weight:700;margin-top:8px;min-height:20px}
#none{text-align:center;color:var(--muted);padding:40px 10px;display:none}
@media (min-width:700px){header{padding-left:max(12px,calc((100% - 640px)/2 + 12px));padding-right:max(12px,calc((100% - 640px)/2 + 12px))}}
</style>

<script>

const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

 { id: "t1", cat: "travel", ic: "🧳", t: "1 · Before travelling — sadaqa & Talab al-Hawaij namaz", c: 0, step: 1, sm: 1,

 { id: "t2", cat: "travel", ic: "🕌", t: "2 · The namaz & dua before leaving", c: 0, step: 2, sm: 1,

   ar: "اَللّٰهُمَّ اِنِّي اَسْتَوْدِعُكَ نَفْسِي وَاَهْلِي وَمَالِي وَدِينِي وَدُنْيَايَ وَاٰخِرَتِي وَاَمَانَتِي وَخَاتِمَةَ عَمَلِي ۝ اَللّٰهُمَّ احْفَظْنِي وَاحْفَظْ مَا مَعِي ۝ وَبَلِّغْنِي وَبَلِّغْ مَا مَعِي بَلَاغَكَ الْحَسَنَ" },
 { id: "t3", cat: "travel", ic: "🚪", t: "3 · When leaving home", c: 3, step: 3, sm: 1,
   note: "Recite this dua when leaving home, then say Allahu Akbar 3 times.",
   ar: "بِسْمِ اللّٰهِ ۝ اٰمَنْتُ بِاللّٰهِ ۝ تَوَكَّلْتُ عَلَى اللّٰهِ ۝ مَا شَآءَ اللّٰهُ ۝ وَلَا حَوْلَ وَلَا قُوَّةَ اِلَّا بِاللّٰهِ ۝ اَللّٰهُمَّ اِنِّي اَسْاَلُكَ خَيْرَ مَا خَرَجْتُ لَهٗ ۝ اَللّٰهُمَّ وَسِّعْ عَلَيَّ فَضْلَكَ ۝ وَاَتْمِمْ عَلَيَّ نِعْمَتَكَ وَاسْتَعْمِلْنِي فِي طَاعَتِكَ ۝ وَاجْعَلْ رَغْبَتِي فِيمَا عِنْدَكَ ۝ وَتَوَفَّنِي عَلٰى مِلَّتِكَ وَمِلَّةِ رَسُولِكَ صَلَّى اللّٰهُ عَلَيْهِ وَعَلٰى اٰلِهٖ" },
 { id: "t4", cat: "travel", ic: "🚗", t: "4 · On setting out & boarding", c: 0, step: 4, sm: 1,

 { id: "t5", cat: "travel", ic: "🧭", t: "5 · After you are seated", c: 7, step: 5, sm: 1,
   note: "After boarding recite 7 times each: Subhanallah, Alhamdulillah, Allahu Akbar, La ilaha illallah — then this dua:",
   ar: "سُبْحَانَ اللّٰهِ ۝ اَلْحَمْدُ لِلّٰهِ ۝ اَللّٰهُ اَكْبَرُ ۝ لَا اِلٰهَ اِلَّا اللّٰهُ ۝ ثُمَّ اَلْحَمْدُ لِلّٰهِ الَّذِي هَدَانَا لِلْاِسْلَامِ وَمَنَّ عَلَيْنَا بِمُحَمَّدٍ نَبِيِّهٖ صَلَّى اللّٰهُ عَلَيْهِ وَعَلٰى اَهْلِ بَيْتِهٖ ۝ سُبْحَانَ الَّذِي سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهٗ مُقْرِنِينَ ۝ وَاِنَّآ اِلٰى رَبِّنَا لَمُنْقَلِبُونَ ۝ وَالْحَمْدُ لِلّٰهِ رَبِّ الْعٰلَمِينَ ۝ اَللّٰهُمَّ اَنْتَ الْحَامِلُ عَلَى الظَّهْرِ وَالْمُسْتَعَانُ عَلَى الْاَمْرِ" },
 { id: "t6", cat: "travel", ic: "🛣️", t: "6 · Dua for the journey", c: 0, step: 6, sm: 1,
   note: "Dua of the traveller.",
   ar: "بَلِّغْ بِنَآ اِلٰى خَيْرِ بَلَاغٍ ۝ يُبَلِّغُ اِلٰى مَغْفِرَتِكَ وَرِضْوَانِكَ ۝ اَللّٰهُمَّ لَا طَيْرَ اِلَّا طَيْرُكَ ۝ وَلَا خَيْرَ اِلَّا خَيْرُكَ ۝ وَلَا حَافِظَ غَيْرُكَ ۝ اَعُوْذُ بِكَ مِنْ وَّعْثَآءِ السَّفَرِ وَكَاٰبَةِ الْمُنْقَلَبِ ۝ وَمِنْ سُوْٓءِ الْمَنْظَرِ فِي الْاَهْلِ وَالْمَالِ وَالْوَلَدِ ۝ اَللّٰهُمَّ اِنِّي اَسْاَلُكَ فِي سَفَرِي هٰذَا التَّقْوٰى وَالسُّرُورَ وَالْعَمَلَ بِمَا يُرْضِيكَ ۝ اَللّٰهُمَّ اقْطَعْ عَنِّي بُعْدَهٗ وَمَشَقَّتَهٗ ۝ وَاَصْلِحْ لِي ۝ وَاخْلُفْنِي بِخَيْرٍ فِي اَهْلِي" },
 { id: "t7", cat: "travel", ic: "🚢", t: "7 · On a ship", c: 0, step: 7, sm: 1,
   note: "Recite Surah Yaseen and any verses of the Quran Majeed you remember, and when boarding a ship recite this dua:",
   ar: "وَمَا قَدَرُوا اللّٰهَ حَقَّ قَدْرِهٖ ۝ وَالْاَرْضُ جَمِيعًا قَبْضَتُهٗ يَوْمَ الْقِيٰمَةِ ۝ وَالسَّمٰوٰتُ مَطْوِيّٰتٌ بِيَمِينِهٖ ؕ سُبْحٰنَهٗ وَتَعٰلٰى عَمَّا يُشْرِكُونَ ۝ بِسْمِ اللّٰهِ مَجْرٰىهَا وَمُرْسٰىهَا ؕ اِنَّ رَبِّي لَغَفُورٌ رَّحِيمٌ ۝ اَللّٰهُمَّ بَارِكْ لَنَا فِي مَوْكِبِنَا وَاَحْسِنْ سَيْرَنَا وَعَافِنَا مِنْ شَرِّ بَحْرِنَا" },
 { id: "t8", cat: "travel", ic: "🌊", t: "8 · High waves & reaching a manzil", c: 0, step: 8, sm: 1,
   note: "When the waves of the sea rise, point towards the wave with your hand and say the first dua. When you alight at any manzil say the second dua.",
   ar: "قَرِّي بِقَرَارِ اللّٰهِ وَاسْكُنِي بِسَكِينَةِ اللّٰهِ ۝ وَلَا حَوْلَ وَلَا قُوَّةَ اِلَّا بِاللّٰهِ ۝ رَبِّ اَنْزِلْنِي مُنْزَلًا مُّبَارَكًا وَّاَنْتَ خَيْرُ الْمُنْزِلِينَ" }
];
const DAYS = [["Sunday", "اِيَّاكَ نَعْبُدُ وَاِيَّاكَ نَسْتَعِينُ"], ["Monday", "يَا غَفُورُ يَا رَحِيمُ"], ["Tuesday", "سُبْحَانَ اللّٰهِ وَالْحَمْدُ لِلّٰهِ"], ["Wednesday", "يَا رَحْمٰنُ يَا رَحِيمُ"], ["Thursday", "حَسْبِيَ اللّٰهُ وَنِعْمَ الْوَكِيلُ"], ["Friday", "يَا ذَا الْجَلَالِ وَالْاِكْرَامِ"], ["Saturday", "يَا حَيُّ يَا قَيُّومُ"]];
const DAYTR = ["Iyyaka Na-Abodo Wa Iyyaka Nastaeen", "Ya Gafooro Ya Rahim", "Subahanllahe wal Hamdo Lillah", "Ya Rahmano Ya Rahim", "Hasbonallahe Wa Nemal Wakeel", "Ya Zal Jalale Wal Ikraam", "Ya Hayyo Ya Qayyum"];

/* Indo-Pak (Nastaleeq) font from Quran.com / QUL, cached for offline use */
const INDOPAK_URL = "https://static-cdn.tarteel.ai/qul/fonts/nastaleeq/Hanafi/normal-v4.2.2/with-waqf-lazmi/font.woff2";
async function loadIndoPak() {
  let data = null;
  try {
    const c = await caches.open("quran-fonts-v1"); let r = await c.match(INDOPAK_URL);
    if (!r) { r = await fetch(INDOPAK_URL, { mode: "cors" }); if (r.ok) await c.put(INDOPAK_URL, r.clone()); }
    if (r.ok) data = await r.arrayBuffer();
  } catch {}
  try { const f = data ? new FontFace("IndoPak", data) : new FontFace("IndoPak", `url(${INDOPAK_URL})`); document.fonts.add(f); await f.load(); } catch {}
}
loadIndoPak();

let cat = "all", open = null;
const counts = ls.get("barakat:counts", {});
const saveCounts = () => ls.set("barakat:counts", counts);
const R = 52, C = 2 * Math.PI * R;

function body(x) {
  let h = "";
  if (x.note) h += `<div class="nt">${esc(x.note)}</div>`;
  if (x.week) {
    const today = new Date().getDay();
    h += `<div class="days">${DAYS.map(([d, a], i) => `<div class="${i === today ? "today" : ""}"><span>${d}</span><i>${a}</i></div>`).join("")}</div>`;
  }
  if (x.deeds) h += `<ol class="deeds">${x.deeds.map(([a, b]) => `<li>${esc(a)}<small>${esc(b)}</small></li>`).join("")}</ol>`;
  if (x.ar) h += `<div class="ar${x.sm ? " sm" : ""}">${x.ar}</div>`;
  if (x.tr) h += `<div class="tr">${esc(x.tr)}</div>`;
  if (x.c) h += counter(x);
  return h;
}
function counter(x) {
  const n = counts[x.id] || 0, p = Math.min(1, n / x.c);
  return `<div class="ctr"><button class="rs" data-reset="${x.id}" aria-label="Reset">↺</button>
    <button class="tap${n >= x.c ? " done" : ""}" data-tap="${x.id}" aria-label="Count"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="${R}"/><circle class="fg" cx="60" cy="60" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - p)).toFixed(1)}"/></svg><div class="n"><b>${n}</b><span>/ ${x.c}</span></div></button>
    <div style="width:44px"></div></div><div class="dn">${n >= x.c ? "✓ " + (n === x.c ? "Complete — Allah accept it" : "Complete (+" + (n - x.c) + ")") : ""}</div>`;
}
function render() {
  const q = $("q").value.trim().toLowerCase();
  const items = T.filter(x => (cat === "all" || x.cat === cat) && (!q || (x.t + " " + (x.tr || "") + " " + (x.note || "") + " " + (x.cat)).toLowerCase().includes(q)));
  let last = "", h = "";
  for (const x of items) {
    if (cat === "all" && x.cat !== last) { last = x.cat; h += `<div class="sec">${esc(CATS.find(c => c[0] === x.cat)[1])}</div>`; }
    const sub = (x.note || x.tr || "").split(/[.:—]/)[0];
    h += `<div class="card${open === x.id ? " open" : ""}" data-id="${x.id}"><div class="ch" data-toggle="${x.id}"><div class="ic">${x.ic}</div><div class="tt"><b>${esc(x.t)}</b><small>${esc(sub)}</small></div>${x.c ? `<div class="cnt${(counts[x.id] || 0) >= x.c ? " d" : ""}">${x.c}×</div>` : ""}<div class="chev">›</div></div><div class="cb">${open === x.id ? body(x) : ""}</div></div>`;
  }
  $("list").innerHTML = h; $("none").style.display = items.length ? "none" : "block";
}
$("chips").innerHTML = CATS.map(([k, l]) => `<button data-c="${k}"${k === "all" ? ' class="on"' : ""}>${l}</button>`).join("");
$("chips").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; cat = b.dataset.c; $("chips").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); render(); scrollTo(0, 0); };
$("q").oninput = render;
$("list").onclick = e => {
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const id = tg.dataset.toggle; open = open === id ? null : id; render(); if (open) setTimeout(() => document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" }), 30); return; }
  const tp = e.target.closest("[data-tap]");
  if (tp) {
    const id = tp.dataset.tap, x = T.find(y => y.id === id), n = (counts[id] || 0) + 1; counts[id] = n; saveCounts();
    haptic(n === x.c ? "done" : "tap");
    const card = tp.closest(".card"); card.querySelector(".cb").innerHTML = body(x);
    const cnt = card.querySelector(".cnt"); if (cnt) cnt.classList.toggle("d", n >= x.c);
    return;
  }
  const rs = e.target.closest("[data-reset]");
  if (rs) { const id = rs.dataset.reset, x = T.find(y => y.id === id); delete counts[id]; saveCounts(); const card = rs.closest(".card"); card.querySelector(".cb").innerHTML = body(x); const cnt = card.querySelector(".cnt"); if (cnt) cnt.classList.remove("d"); }
};
render();
const openId = new URLSearchParams(location.search).get("i"); if (openId && T.find(x => x.id === openId)) { open = openId; render(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
