*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;background:var(--hdr);color:var(--hdr-ink)}
header a,header button{color:inherit;background:none;border:0;font:inherit;text-decoration:none;font-size:22px;min-width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
header b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pg{font-size:13px;font-weight:600;background:var(--hdr-chip);padding:0 10px;min-width:0}
#pages{max-width:900px;margin:0 auto;padding:8px 6px 90px}
.pg{position:relative;background:#fff;margin:0 auto 8px;box-shadow:0 1px 4px rgba(0,0,0,.15);width:100%}
.pg canvas{position:absolute;inset:0;width:100%;height:100%}
.pg .no{position:absolute;right:6px;bottom:4px;font-size:10px;color:#999}
.pg a.lk{position:absolute;display:block;border-radius:3px}
.pg a.lk:active{background:rgba(255,200,0,.35)}
.pg a.lk.ext{background:rgba(31,120,180,.08)}
#backJump{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:6;border:0;border-radius:22px;padding:10px 16px;font:inherit;font-weight:700;background:var(--brand);color:var(--on-brand);box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
#msg{text-align:center;color:var(--muted);padding:40px 16px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto;transform:translateY(100%);transition:transform .22s;z-index:10;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 8px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet .it{display:flex;justify-content:space-between;gap:10px;padding:11px 6px;border-top:1px solid var(--line);cursor:pointer}
.sheet .it span{color:var(--muted);font-size:13px}
.jump{display:flex;gap:8px;margin:4px 0 10px}
.jump input{flex:1;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.jump button{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;background:var(--brand);color:var(--on-brand)}
.sheet .stk{position:sticky;top:-14px;background:var(--card);padding:6px 0 4px;z-index:2}
.sheet .sec{display:flex;align-items:center;gap:8px;font-size:14px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer}
.sheet .sec b{flex:1}.sheet .sec span{color:var(--muted);font-size:13px}
.sheet .sec::after{content:"›";font-size:22px;color:var(--muted);transform:rotate(90deg);transition:transform .2s}
.sheet .grp.open>.sec::after{transform:rotate(-90deg)}
.sheet .kids{display:none;margin:0 0 6px 10px;border-left:2px solid var(--line)}
.sheet .grp.open>.kids{display:block}
.sheet .kids .it{font-size:13px;padding:7px 8px;border-top:0;border-bottom:1px solid var(--line)}
.sheet .kids .it .ur{display:block;font-size:14px;direction:rtl;text-align:right;color:var(--ink);font-family:"Noto Nastaliq Urdu","Geeza Pro","Arial",serif;margin-top:2px}
.sheet .kids .it .lt{flex:1}
.sheet .none{color:var(--muted);text-align:center;padding:18px}
.sheet .it .xp{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--brand);border-radius:8px;font:inherit;font-size:12px;font-weight:700;padding:2px 8px;margin-left:6px;align-self:center}
.sheet .items{display:none;margin:0 0 6px 8px;padding:6px 4px;background:var(--bg);border-radius:8px}
.sheet .items.on{display:block}
.sheet .lets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sheet .lets canvas{height:34px;width:auto;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.sheet .ipg{border-top:1px solid var(--line)}
.sheet .ph{display:flex;gap:8px;align-items:center;padding:8px 4px;font-size:12px;cursor:pointer}
.sheet .ph b{flex:none}.sheet .ph span{flex:1;color:var(--muted);text-align:right}
.sheet .ph::after{content:"›";font-size:18px;color:var(--muted);transform:rotate(90deg);transition:transform .2s}
.sheet .ipg.open>.ph::after{transform:rotate(-90deg)}
.sheet .pb{display:none;min-height:30px}.sheet .ipg.open>.pb{display:block}
.sheet .row{display:block;margin:0 0 2px;background:#fff;border-radius:3px;cursor:pointer;overflow:hidden}
.sheet .row canvas{display:block;width:100%;height:auto}
.sheet .row:active{outline:2px solid var(--brand)}

<script>
"use strict";
// Large PDF reader: loads the file with HTTP range requests (no full download), renders only the

const BOOKS = {

    src: "https://dawoodibohraapp.com/Duas/66%20tasbih%20ul%20azam.html", srcName: "dawoodibohraapp.com" },
  // Khazain ma'ani al-Quran al-Faiqa. Contents = targets of the PDF's own Juz index (page 1).
  // This file has Juz 1–25 and 30 only (26–29 are not in it).
  quran: { title: "Quran — Khazain (Juz 1–25, 30)", pdf: "books/quran-khazain-30-juz.pdf", label: "Juz", note: "bkQNote",
    toc: [[1, 9], [2, 30], [3, 50], [4, 70], [5, 90], [6, 112], [7, 132], [8, 152], [9, 172], [10, 192], [11, 217], [12, 237], [13, 257], [14, 277], [15, 297],
          [16, 322], [17, 342], [18, 362], [19, 382], [20, 402], [21, 427], [22, 447], [23, 467], [24, 487], [25, 507], [30, 539]] },
};

const $ = id => document.getElementById(id);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const L = I18N[ls.get("lang", "en")] || I18N.en;
const t = (k, v = {}) => String(L[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const id = new URLSearchParams(location.search).get("b") || "zikre";
const B = BOOKS[id] || BOOKS.zikre;
document.title = B.title; $("title").textContent = B.title;

let pdf, N = 0, ratio = 792 / 612, cur = 1, outline = [];
const els = [], rendered = new Map(); // page → {task}
const jumpStack = [];

function pageAt() { // page whose box covers 30% of the viewport height
  const y = innerHeight * 0.3;
  let lo = 0, hi = N - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (els[m].getBoundingClientRect().top <= y) lo = m; else hi = m - 1; }
  return lo + 1;
}
function goto(p, push) {
  p = Math.max(1, Math.min(N, p | 0));
  if (push) { jumpStack.push(cur); showBack(); }
  els[p - 1].scrollIntoView({ block: "start" });
  scrollBy(0, -56);
}
function showBack() {
  const b = $("backJump");
  if (!jumpStack.length) { b.style.display = "none"; return; }
  b.textContent = "↩ " + t("bkBack", { p: jumpStack[jumpStack.length - 1] });
  b.style.display = "block";
}
$("backJump").onclick = () => { const p = jumpStack.pop(); showBack(); if (p) goto(p, false); };

async function destToPage(dest) {
  if (typeof dest === "string") dest = await pdf.getDestination(dest);
  if (!Array.isArray(dest)) return null;
  const ref = dest[0];
  return (typeof ref === "object" ? await pdf.getPageIndex(ref) : ref) + 1;
}

async function renderPage(n) {
  if (B.images || rendered.has(n)) return;
  const box = els[n - 1], rec = { cancel: false };
  rendered.set(n, rec);
  const page = await pdf.getPage(n);
  if (rec.cancel) return;
  const w = box.clientWidth, base = page.getViewport({ scale: 1 });
  const scale = w / base.width, dpr = Math.min(devicePixelRatio || 1, 3);
  const vp = page.getViewport({ scale: scale * dpr });
  const c = document.createElement("canvas");
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  rec.task = page.render({ canvasContext: c.getContext("2d"), viewport: vp });
  try { await rec.task.promise; } catch { return; }
  if (rec.cancel) return;
  box.querySelectorAll("canvas,a.lk").forEach(e => e.remove());
  box.prepend(c);
  // hyperlinks
  const vp1 = page.getViewport({ scale });
  for (const a of await page.getAnnotations()) {
    if (a.subtype !== "Link" || rec.cancel) continue;
    const [x1, y1, x2, y2] = vp1.convertToViewportRectangle(a.rect);
    const el = document.createElement("a");
    el.className = "lk";
    Object.assign(el.style, { left: Math.min(x1, x2) + "px", top: Math.min(y1, y2) + "px", width: Math.abs(x2 - x1) + "px", height: Math.abs(y2 - y1) + "px" });
    if (a.url) { el.href = a.url; el.target = "_blank"; el.rel = "noopener"; el.classList.add("ext"); }
    else if (a.dest) { el.href = "#"; el.onclick = async e => { e.preventDefault(); const p = await destToPage(a.dest); if (p) goto(p, true); }; }
    else continue;
    box.append(el);
  }
}
function unrender(n) {
  const rec = rendered.get(n); if (!rec) return;
  rec.cancel = true; try { rec.task && rec.task.cancel(); } catch {}
  rendered.delete(n);
  els[n - 1].querySelectorAll("canvas,a.lk").forEach(e => e.remove());
}
let raf = 0;
function update() {
  raf = 0;
  cur = pageAt();
  $("pg").textContent = `${cur} / ${N}`;
  ls.set("book:" + id, cur);
  const want = new Set();
  for (let p = cur - 2; p <= cur + 3; p++) if (p >= 1 && p <= N) want.add(p);
  for (const p of [...rendered.keys()]) if (!want.has(p)) unrender(p);
  want.forEach(p => renderPage(p));
}
addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
addEventListener("resize", () => { [...rendered.keys()].forEach(unrender); update(); });

[67,"Amirul Momineen — Manqabat","امير المؤمنين صع منقبة"],[71,"Amirul Momineen — Noha & Nasaih","امير المؤمنين صع نوحه و نصائح"],[73,"Moulatona Fatema","مولاتنا فاطمة صع"],
[75,"Imam Hasan","امام حسن صع"],[76,"Al-Tajla","التجلاء"],[79,"Imam Husain na Maajiz","امام حسين ع نا معاجز"],[96,"Nasihat","نصيحة"],
[99,"Nasaih fi Madh Moulana al-Mun'im","نصائح في مدح مولانا المنعام"],[101,"Nasaih Mutafarriq Unwan","نصائح متفرق عنوان"],[103,"Auliya-e-Kiram","اولياء كرام صع"],
[105,"Mutafarriq Manzumaat","متفرق منظومات"],[106,"Hifz al-Quran & Mutafarriq","حفظ القرآن و متفرق"],[108,"Mutafarriq Qasaid","متفرق قصائد"],
[109,"Marasi Sayyid ash-Shuhada (Arabic)","مراثي سيد الشهداء (في العربي)"],[922,"Chalo Ae Pyara","چلو اے پیارا"],[1156,"Chehlum Imam Husain","چهلم امام حسين ع"],
[1173,"Dars","درس"],[1194,"Ae Allah na Daai","اے الله نا داعي"],[1217,"Rojo Baradar","روجو برادر"],[1229,"Ya Husaina Par Hamein Qurban Chhe","يا حسينا پر همين قربان چھے"],
[1238,"Karbala Mere Aaqa Sidhare","کربلا میرے آقا سدھارے"],[1278,"Meethi Sheetabi","میٹھی شیتابی"],[1316,"Shaadi (Marasi & Madaih)","شادي (مراثي ومدائح)"],
[1376,"Salaam Noha","سلام نوحه"],[2279,"Ahle Bait","اهل بيت"],[2711,"Matami Noha","ماتمي نوحه"],
[3648,"Madaih — Syedna Aali Qadr Mufaddal Saifuddin (TUS)","الداعي الاجل سيدنا عالي قدر مفضل سيف الدين"],[4186,"Madaih — Syedna Mohammed Burhanuddin (RA)","مدائح الداعي الاجل سيدنا محمد برهان الدين"]];
const SRCH = { en: "Search contents…", gu: "ફેહરિસ્તમાં શોધો…", hi: "Fehrist me search karo…" };
const NOMATCH = { en: "Nothing found", gu: "કંઈ મળ્યું નથી", hi: "Kuch nahi mila" };
const lang = ls.get("lang", "en");
const fold = x => String(x).toLowerCase().replace(/[\u064b-\u065f\u0670]/g, "").replace(/ee/g, "i").replace(/oo/g, "u").replace(/[^a-z0-9\u0600-\u06ff]/g, "").replace(/(.)\1+/g, "$1");

const ZIDX = {"62":[62,63,64],"66":[66],"67":[67,68,69,70],"71":[71],"73":[73],"75":[75],"76":[76,77],"79":[79,80,81,82,83,85,86,87,88,89,90,91,92,93,94],"96":[96,97,98],"99":[99,100],"101":[101,102],"105":[105],"106":[106],"108":[108],"109":[109,110],"1156":[1156],"1173":[1173,1174],"1278":[1278],"1316":[1316,1317],"1376":[1376,1377,1378,1379,1380,1381,1382,1383,1384,1385,1386,1387,1388,1389,1390,1391,1392,1393,1394,1395,1396,1397,1398,1399,1400,1401,1402,1403],"2279":[2279,2280,2281,2282,2283,2284,2285,2286,2287,2288,2289,2290,2291],"2711":[2711,2712,2713,2714,2715,2716,2717,2718,2719,2720,2721,2722,2723,2724,2725,2726,2727,2728,2729,2730,2731,2732,2733,2734,2735,2736,2737,2738],"3648":[3648,3649,3650,3651,3652,3653,3654,3655,3656,3657,3658,3659,3660,3661,3662,3663,3664,3665,3666,3667],"4186":[4186,4187,4188,4189,4190,4191,4192,4193,4194,4195,4196,4197,4198,4199,4200,4201,4202,4203,4204,4205,4206,4207,4208,4209,4210,4211,4212,4213,4214,4215,4216,4217]};
const LETTERS = new Set([1376, 2279, 2711, 3648, 4186]);
const idxCache = new Map();
async function idxRows(p) { // rows of an index page: [{y1,y2,dest}]
  if (idxCache.has(p)) return idxCache.get(p);
  const pg = await pdf.getPage(p), bands = new Map();
  for (const a of await pg.getAnnotations()) {
    if (a.subtype !== "Link" || !a.dest) continue;
    const [x1, y1, x2, y2] = a.rect; if (y2 > 792 - 70) continue;
    const d = await destToPage(a.dest).catch(() => 0); if (!d || d <= p) continue;
    const k = Math.round((y1 + y2) / 12), b = bands.get(k);
    if (!b) bands.set(k, { y1: Math.min(y1, y2), y2: Math.max(y1, y2), dest: d });
    else { b.y1 = Math.min(b.y1, y1, y2); b.y2 = Math.max(b.y2, y1, y2); }
  }
  const rows = [...bands.values()].filter(b => b.y2 - b.y1 > 8 && b.y2 - b.y1 < 90).sort((a, b) => b.y2 - a.y2);
  idxCache.set(p, rows); return rows;
}
async function renderCrops(p, rects, wPx, pad) { // rects: [x1,y1,x2,y2] in pdf pts → canvases
  const pg = await pdf.getPage(p), base = pg.getViewport({ scale: 1 });
  const sc = wPx / base.width * 2, vp = pg.getViewport({ scale: sc });
  const c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
  return rects.map(([x1, y1, x2, y2]) => {
    const sx = Math.max(0, x1 * sc - pad), sy = Math.max(0, (792 - y2) * sc - pad), sw = Math.min(c.width - sx, (x2 - x1) * sc + 2 * pad), sh = Math.min(c.height - sy, (y2 - y1) * sc + 2 * pad);
    const o = document.createElement("canvas"); o.width = Math.max(1, Math.floor(sw)); o.height = Math.max(1, Math.floor(sh));
    o.getContext("2d").drawImage(c, sx, sy, sw, sh, 0, 0, o.width, o.height); return o;
  });
}
const ioItems = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { ioItems.unobserve(e.target); fillIdx(e.target); } }), { root: null, rootMargin: "300px" }) : null;
async function fillIdx(box) {
  const p = +box.dataset.ip; box.dataset.done = 1;
  try {
    const rows = await idxRows(p); if (!rows.length) { box.remove(); return; }
    const cs = await renderCrops(p, rows.map(r => [0, r.y1 - 1, 612, r.y2 + 1]), 340, 0);
    const pb = box.querySelector(".pb"); pb.innerHTML = "";
    cs.forEach((c, i) => { const r = document.createElement("div"); r.className = "row"; r.dataset.p = rows[i].dest; r.append(c); pb.append(r); });
  } catch (e) {}
}
async function openItems(sub, host) {
  host.classList.toggle("on"); if (host.dataset.built) return; host.dataset.built = 1;
  let h = "";
  if (LETTERS.has(sub)) h += `<div class="lets" id="lt${sub}"></div>`;
  h += ZIDX[sub].map((p, i) => `<div class="ipg" data-ip="${p}"><div class="ph" data-n="${i + 1}"><b>${t("bkPart")} ${i + 1}</b><span>${t("bkPage")} ${p}</span></div><div class="pb"></div></div>`).join("");
  host.innerHTML = h;
  host.querySelectorAll(".ipg").forEach(async b => {   // label each part with the pages its items lead to
    try { const rows = await idxRows(+b.dataset.ip); if (rows.length) { const ds = rows.map(r => r.dest), lo = Math.min(...ds), hi = Math.max(...ds); b.querySelector(".ph span").textContent = `${t("bkItems")}: ${rows.length} · ${t("bkPage")} ${lo}–${hi}`; } } catch {}
  });
  if (LETTERS.has(sub)) { // alphabet: one chip per letter, cropped from the section's own header page
    const pg = await pdf.getPage(sub), g = new Map();
    for (const a of await pg.getAnnotations()) {
      if (a.subtype !== "Link" || !a.dest) continue;
      const d = await destToPage(a.dest).catch(() => 0); if (!ZIDX[sub].includes(d)) continue;
      const [x1, y1, x2, y2] = a.rect, b = g.get(d);
      if (!b) g.set(d, [Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)]);
      else { b[0] = Math.min(b[0], x1, x2); b[1] = Math.min(b[1], y1, y2); b[2] = Math.max(b[2], x1, x2); b[3] = Math.max(b[3], y1, y2); }
    }
    const ds = [...g.keys()].sort((a, b) => a - b), cs = await renderCrops(sub, ds.map(d => g.get(d)), 600, 2);
    const box = $("lt" + sub); if (box) cs.forEach((c, i) => { c.dataset.p = ds[i]; box.append(c); });
  }
}
function openSheet() {
  if (id === "zikre" && outline.length) return openTree();

  $("sheet").innerHTML = `<h3>${t("bkContents")}</h3>
    <div class="jump"><input id="jp" type="number" inputmode="numeric" min="1" max="${N}" placeholder="${t("bkPage")} (1–${N})"><button id="jgo">${t("bkGo")}</button></div>
    <div class="it" data-p="1"><b>${t("bkIndex")}</b><span>1</span></div>
    ${B.note ? `<p style="color:var(--muted);font-size:12px;margin:6px">${esc(t(B.note))}</p>` : ""}${outline.map(o => `<div class="it" data-p="${o.p}"><b>${esc(o.title)}</b><span>${o.p}</span></div>`).join("")}`;
  $("sbg").style.display = "block"; lockBody(); requestAnimationFrame(() => $("sheet").classList.add("on"));
  $("jgo").onclick = () => { const p = +$("jp").value; if (p) { closeSheet(); goto(p, true); } };
}

function openTree() {
  const secs = outline.map((o, i) => ({ ...o, kids: ZSUB.filter(k => k[0] >= o.p && (i + 1 >= outline.length || k[0] < outline[i + 1].p)) }));
  const curSec = secs.filter(x => x.p <= cur).length - 1;
  const row = k => `<div class="it" data-p="${k[0]}" data-f="${esc(fold(k[1] + k[2] + k[0]))}"><div class="lt"><b>${esc(k[1])}</b><span class="ur">${esc(k[2])}</span></div><span>${k[0]}</span>${ZIDX[k[0]] ? `<button class="xp" data-x="${k[0]}">${t("bkItems")} ▾</button>` : ""}</div>${ZIDX[k[0]] ? `<div class="items" id="it${k[0]}"></div>` : ""}`;
  $("sheet").innerHTML = `<div class="stk"><div class="grab"></div><h3>${t("bkContents")}</h3>
    <div class="jump"><input id="jp" type="number" inputmode="numeric" min="1" max="${N}" placeholder="${t("bkPage")} (1–${N})"><button id="jgo">${t("bkGo")}</button></div>
    <div class="jump"><input id="sq" type="search" placeholder="${SRCH[lang] || SRCH.en}" autocomplete="off"></div></div>
    <div id="tree">${secs.map((x, i) => `<div class="grp" data-sf="${esc(fold(x.title))}"><div class="sec" data-p="${x.p}"><b>${esc(x.title)}</b><span>${x.p}</span></div><div class="kids">${x.kids.map(row).join("") || `<div class="it" data-p="${x.p}"><b>${t("bkGo")}</b><span>${x.p}</span></div>`}</div></div>`).join("")}</div>
    <div class="none" id="nm" hidden>${NOMATCH[lang] || NOMATCH.en}</div>`;
  $("sbg").style.display = "block"; lockBody(); requestAnimationFrame(() => $("sheet").classList.add("on"));
  $("jgo").onclick = () => { const p = +$("jp").value; if (p) { closeSheet(); goto(p, true); } };
  $("sq").oninput = () => {
    const q = fold($("sq").value); let any = false;
    document.querySelectorAll("#tree .grp").forEach(g => {
      const secHit = q && g.dataset.sf.includes(q); let hit = 0;
      g.querySelectorAll(".kids .it").forEach(it => { const m = !q || secHit || it.dataset.f.includes(q); it.style.display = m ? "" : "none"; if (it.nextElementSibling && it.nextElementSibling.classList.contains("items")) it.nextElementSibling.style.display = m ? "" : "none"; if (m) hit++; });
      g.style.display = hit ? "" : "none"; if (hit) any = true;
      if (q) g.classList.add("open"); else g.classList.remove("open");
    });
    $("nm").hidden = any;
  };
}
let lockY = null;
function lockBody() { if (lockY != null) return; lockY = scrollY; const b = document.body.style; b.position = "fixed"; b.top = -lockY + "px"; b.left = "0"; b.right = "0"; b.width = "100%"; }
function unlockBody() { if (lockY == null) return; const y = lockY; lockY = null; const b = document.body.style; b.position = b.top = b.left = b.right = b.width = ""; scrollTo(0, y); }
$("sbg").addEventListener("touchmove", e => e.preventDefault(), { passive: false });
function closeSheet() { $("sheet").classList.remove("on"); $("sbg").style.display = "none"; unlockBody(); }

// swipe down to close the contents sheet (works when the list is at the top, or when dragging the header)
(function () {
  const sh = $("sheet"); let y0 = null, dy = 0, drag = false;
  sh.style.overscrollBehavior = "contain";
  sh.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; drag = false; }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if (y0 == null) return;
    const d = e.touches[0].clientY - y0;
    if (!drag && d > 6 && sh.scrollTop <= 0) { drag = true; sh.style.transition = "none"; }
    if (!drag) return;
    dy = Math.max(0, d); e.preventDefault(); sh.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  const end = () => {
    if (y0 == null) return; y0 = null;
    if (!drag) return; drag = false; sh.style.transition = "";
    if (dy > 90) { sh.style.transform = ""; closeSheet(); } else sh.style.transform = "";
  };
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
})();
$("sbg").onclick = closeSheet;
$("tocBtn").onclick = $("pg").onclick = openSheet;
$("sheet").onclick = e => {
  const xb = e.target.closest(".xp");
  if (xb) { e.stopPropagation(); openItems(+xb.dataset.x, $("it" + xb.dataset.x)); return; }
  const ph = e.target.closest(".ph");
  if (ph) { const b = ph.parentElement; b.classList.toggle("open"); if (b.classList.contains("open") && !b.dataset.done) fillIdx(b); return; }
  const cv = e.target.closest(".lets canvas"); if (cv) { closeSheet(); goto(+cv.dataset.p, true); return; }
  const sc = e.target.closest(".sec");
  if (sc) { if (e.target.tagName === "SPAN") { closeSheet(); goto(+sc.dataset.p, true); } else sc.parentElement.classList.toggle("open"); return; }
  const it = e.target.closest("[data-p]"); if (it) { closeSheet(); goto(+it.dataset.p, true); } };

(async () => {
  if (B.images) {
    N = B.images.length;
    B.images.forEach((src, i) => {
      const d = document.createElement("div");
      d.className = "pg"; d.style.aspectRatio = `1 / ${B.ratio}`;
      d.innerHTML = `<img src="${src}" alt="${i + 1}" style="width:100%;height:100%;display:block" loading="${i < 2 ? "eager" : "lazy"}"><span class="no">${i + 1}</span>`;
      els.push(d);
    });
    $("pages").replaceChildren(...els);
    if (B.src) $("pages").insertAdjacentHTML("beforeend", `<p style="text-align:center;color:var(--muted);font-size:12px">${t("bkSrc")}: <a style="color:var(--brand)" href="${B.src}" target="_blank" rel="noopener">${esc(B.srcName)}</a></p>`);
    $("tocBtn").style.display = "none";
    const last = ls.get("book:" + id, 1); if (last > 1) goto(last, false);
    update(); return;
  }
  try {
    pdf = await pdfjsLib.getDocument({ url: B.pdf, rangeChunkSize: 262144, disableAutoFetch: true, disableStream: true }).promise;
  } catch (e) { $("msg").textContent = t("bkFail") + " (" + e.message + ")"; return; }
  N = pdf.numPages;
  const p1 = await pdf.getPage(1), v = p1.getViewport({ scale: 1 });
  ratio = v.height / v.width;
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= N; i++) {
    const d = document.createElement("div");
    d.className = "pg"; d.style.aspectRatio = `1 / ${ratio}`;
    d.innerHTML = `<span class="no">${i}</span>`;
    els.push(d); frag.append(d);
  }
  $("pages").replaceChildren(frag);
  if (B.toc) outline = B.toc.map(([k, p]) => ({ title: `${B.label} ${k}`, p }));
  else {
    const ol = await pdf.getOutline().catch(() => null) || [];
    for (const o of ol) { const p = await destToPage(o.dest).catch(() => null); if (p) outline.push({ title: o.title, p }); }
  }
  const last = +new URLSearchParams(location.search).get("p") || ls.get("book:" + id, 1);
  if (last > 1) goto(last, false);
  update();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
