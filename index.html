*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html{touch-action:manipulation}
body{padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));min-height:100vh}
.ar{font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif}
header.top{background:var(--hdr);color:var(--hdr-ink);padding:14px 0 0}
.top .hd{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 18px 12px;gap:10px}
.top .wdn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.top .big{font-size:44px;font-weight:600;line-height:1;color:var(--hdr-gold,var(--gold));font-variant-numeric:tabular-nums;margin:2px 0}
.top .big.ar{font-size:50px;font-weight:400;line-height:.9}
.top .hcol{text-align:right}
.top .hm{font-size:17px;line-height:1.2}
.top .my{font-size:13px;opacity:.8}
.top .hstrip{display:flex;justify-content:space-between;gap:8px;padding:7px 18px;font-size:11px;letter-spacing:.04em;background:var(--hdr-chip)}
.top .hstrip span:last-child{text-align:right;opacity:.85}
.top .hstrip{align-items:center}
.top .hstrip #tLoc{white-space:nowrap;flex:none}
.top .hstrip #tEve{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .hstrip #locBtn{flex:none}
#locBtn{border:1px solid var(--gold);background:none;color:var(--hdr-ink);font:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:4px 10px;white-space:nowrap}
.top .tstrip{display:flex;justify-content:space-between;gap:4px;padding:8px 14px;font-size:11px}
.top .tstrip span{opacity:.55}
.top .tstrip span{display:flex;flex-direction:column;align-items:center;text-align:center;white-space:nowrap}
.top .tstrip span b{font-weight:600;margin:1px 0 0;font-size:14px}
.top .tstrip span.nx{opacity:1;font-weight:700}
.top .nextmq{padding:8px 18px 10px;font-size:13px;border-top:1px solid var(--hdr-chip);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .nextmq:empty{display:none}
/* phones: reserve the header rows before JS fills them, so the page does not jump down on load (CLS) */
@media (max-width:599px){.top .hd{min-height:104px}.top .hstrip{min-height:39px}.top .tstrip{min-height:52px}.top .nextmq:empty{display:block;min-height:37px}#mTitle{min-height:67px}#cal{min-height:309px}#calKey{min-height:85px}}
.top .nextmq small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--hdr-gold,var(--gold));margin-right:6px}
main{max-width:640px;margin:0 auto;padding:12px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.monthbar button{background:var(--chip);border:0;color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:20px}
.monthbar .title{text-align:center;flex:1}
.monthbar .title b{display:block;font-size:17px}
.monthbar .title span{font-size:12px;color:var(--muted)}
.monthbar .title .ar{font-size:15px;color:color-mix(in srgb,var(--gold) 65%,var(--ink));display:block}
table.cal{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed}
.cal th{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.cal th.fri{color:var(--brand)}
.cal td{height:54px;vertical-align:middle;text-align:center;border-radius:12px;padding:0;position:relative;cursor:pointer;background:transparent}
.cal td.fri{background:color-mix(in srgb,var(--brand) 6%,transparent)}
.cal td.filler,.cal td.empty{background:transparent;cursor:default}
.cal td.filler>*{opacity:.35}
.cal td .h{font-size:20px;font-weight:600;line-height:1}
.cal td .h.ar{font-size:21px;font-weight:400}
.cal td .g{position:absolute;top:3px;right:5px;font-size:9px;color:var(--muted);line-height:1;white-space:nowrap}
.cal td .g b{font-weight:700;color:var(--brand)}
.cal td.mq1{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.cal td.mq1n{background:color-mix(in srgb,var(--night) 16%,transparent)}
.dot{position:absolute;left:0;right:0;bottom:4px;height:5px;display:flex;justify-content:center;gap:2px}
.dot i{width:5px;height:5px;border-radius:50%;background:var(--brand-2)}
.dot i.d{background:var(--gold)} .dot i.n{background:var(--night)}
.cal td.rzd:not(.today){box-shadow:inset 0 0 0 2px color-mix(in srgb,#2e8b57 55%,transparent)}
.cal td .rzm{position:absolute;top:3px;left:4px;font-size:10px;line-height:1}
.cal td.today{background:var(--today);color:var(--today-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--today) 40%,transparent)}
.cal td.today .g,.cal td.today .g b{color:var(--today-ink);opacity:.95}
.cal td.today .dot i{background:var(--today-ink)}
.cal td.filler.today{background:transparent;box-shadow:none;color:var(--brand)}
.cal td.filler.today .g{color:var(--muted)}
.cal td.sel:not(.today){outline:2px solid var(--brand);outline-offset:-2px}
.key{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.key .s{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:7px;position:relative;font-size:14px;font-weight:600;color:var(--ink);vertical-align:middle;margin-right:4px;border:1px solid var(--line)}
.key .s small{position:absolute;top:1px;right:2px;font-size:7px;color:var(--muted);font-weight:400}
.key .ksw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.mlist{margin-top:4px}
.mrow{display:flex;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer}
.mrow:first-child{border-top:0}
.mrow .dd{flex:0 0 46px;text-align:center;border-radius:10px;padding:4px 0;background:var(--chip)}
.mrow .dd b{display:block;font-size:17px;line-height:1.1}
.mrow .dd span{font-size:10px;color:var(--muted)}
.mrow.p1 .dd{background:color-mix(in srgb,var(--gold) 25%,transparent)}
.mrow.p1n .dd{background:color-mix(in srgb,var(--night) 18%,transparent)}
.mrow.past{opacity:.55}
.mrow .tt{flex:1;min-width:0;font-size:14px}
.mrow .tt div+div{margin-top:2px}
.mrow .tt .sub{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px;justify-content:center}
h3{margin:4px 0 8px;font-size:15px}
.mq{padding:8px 0;border-top:1px solid var(--line)}
.mq:first-of-type{border-top:0}
.mq .t{font-weight:600}
.mq .d{font-size:13px;color:var(--muted)}
.mq .when{font-size:12px;color:var(--brand);font-weight:600}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:middle}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.times div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.times small{display:block;color:var(--muted);font-size:11px}
.times b{font-size:16px}
.muted{color:var(--muted);font-size:12px}
.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
.btn.ghost{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.conv-out{font-size:18px;font-weight:700;margin-top:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 10px;font-size:11px}
nav.tabs button .i{display:block;font-size:20px;line-height:1.2}
.view#v-zy{display:block;visibility:hidden;pointer-events:none}
.view#v-zy.on{visibility:visible;pointer-events:auto}
html.zyon,html.zyon body{overflow:hidden;height:100%;overscroll-behavior:none}
#v-zy::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--hdr,var(--brand));z-index:6}
#v-zy iframe{position:fixed;left:0;top:env(safe-area-inset-top);width:100%;height:calc(100vh - var(--navh,58px) - env(safe-area-inset-top));height:calc(100dvh - var(--navh,58px) - env(safe-area-inset-top));border:0;background:var(--bg);z-index:6}
.slhead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.slhead b{flex:1;font-size:18px}
.slb{border:0;background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:22px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.slcity{border:0;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.12);max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.slhero{background:linear-gradient(145deg,var(--brand),color-mix(in srgb,var(--brand) 85%,#000));color:var(--on-brand);border-radius:22px;padding:16px 14px 14px;text-align:center;box-shadow:0 2px 6px color-mix(in srgb,var(--brand) 25%,transparent)}
.sldate{font-size:14px;opacity:.92;line-height:1.4}.sldate b{font-size:16px}
.slring{position:relative;width:190px;height:190px;margin:10px auto 8px}
.slring svg{width:100%;height:100%}
.slring .bg{fill:none;stroke:color-mix(in srgb,currentColor 22%,transparent);stroke-width:7}
.slring .fg{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .9s linear}
.slc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 26px}
.slc small{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.slc b{font-size:30px;font-weight:700;line-height:1.1}
.slc span{font-size:13px;opacity:.9}
.slseg{display:inline-flex;margin-top:4px;background:color-mix(in srgb,currentColor 16%,transparent);border-radius:14px;padding:3px}
.slseg button{border:0;background:none;color:inherit;font:inherit;font-size:14px;font-weight:600;padding:6px 16px;border-radius:11px}
.slseg button:active{background:color-mix(in srgb,currentColor 25%,transparent)}
html.native #pushCard,html.native #instCard,html.native #instBar,html.native #azApk,html.native #pushPrompt{display:none!important}/* app tour (first-visit walkthrough) */

#tour .tf{display:flex;align-items:center;gap:8px}#tour .tf .dots{flex:1;display:flex;gap:3px}#tour .tf .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}#tour .tf .dots i.on{background:var(--brand);width:14px;border-radius:4px}
#tour .tf button{font:inherit;border:0;border-radius:18px;padding:8px 16px;font-weight:600;background:var(--brand);color:#fff}#tour .tf button.g{background:transparent;color:var(--muted);padding:8px 10px}
.hfq{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px 12px}.hfq a{padding:7px 14px;border-radius:18px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}.hfq a:active{background:var(--line)}
.azopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.azopts label{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;background:var(--chip,rgba(127,127,127,.14));font-size:14px}.azopts label.on{background:var(--brand);color:#fff}.azopts input{accent-color:#fff}

.slcard{padding:6px 8px;margin-top:12px}

.pgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

#pushOth{margin-top:4px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--bg)}
.prow label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.25}
/* one checkbox look everywhere: theme colours, clear tick, focus ring */

/* solid header-coloured strip behind the iPhone status bar so scrolled content never shows through it */
#topcap{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--hdr);z-index:45;pointer-events:none}
.instbar{display:flex;align-items:center;gap:8px;background:var(--gold);color:#1a1405;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px 14px;font-size:13px}
.instbar[hidden]{display:none}
.instbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instbar button{border:0;border-radius:999px;background:#1a1405;color:#fff;font:inherit;font-weight:700;font-size:12px;padding:6px 14px;white-space:nowrap}
.instbar button.x{background:none;color:#1a1405;font-size:20px;padding:0 6px;line-height:1}
.thumb{flex:none;width:44px;height:54px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f3ead8}

#imgView{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 50px) 10px calc(env(safe-area-inset-bottom) + 20px)}
#imgView.on{display:block}

#imgView button{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:40px;height:40px;border-radius:20px;border:0;font-size:22px;background:rgba(255,255,255,.9);color:#000}
.qcard{text-align:center;padding:16px 18px 14px;min-height:190px;cursor:pointer}.qcard.qsheet{min-height:0;padding:4px 0 8px;cursor:auto}
.qcard .qk{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.qcard .qm{display:block;margin:14px auto 0;color:var(--ink);background:currentColor;aspect-ratio:var(--r);width:min(100%,calc(var(--w)*.56px));-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.qcard .qm.qa{margin-bottom:14px}.qcard .qm.qu{opacity:.88}
.qcard .qm.qa::after{content:""}
.qcard .qd{width:28px;height:2px;border-radius:1px;background:var(--gold);margin:0 auto}
.qcard .qt{margin:16px auto 0;max-width:30em;white-space:pre-line;font-family:Kalam,"Segoe Print","Comic Sans MS",cursive;font-weight:400;font-size:20px;line-height:1.55;color:var(--ink);text-wrap:pretty}
.qcard .qn{margin-top:14px;font-size:11px;color:var(--muted)}
@font-face{font-family:"Kalam";font-weight:400;font-display:swap;src:url(fonts/Kalam-400.woff2) format("woff2")}
@font-face{font-family:Amiri;font-weight:400;font-display:swap;src:url(fonts/Amiri-400.woff2) format("woff2")}
.qcard .qar{margin:14px auto;white-space:pre-line;text-wrap:balance;font:400 26px/1.95 Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;color:var(--ink)}
@font-face{font-family:"Noto Nastaliq Urdu";font-weight:400;font-display:swap;src:url(fonts/NotoNastaliqUrdu-400.woff2) format("woff2")}
.qcard .qur{margin:6px auto 4px;white-space:pre-line;font:400 19px/2.3 "Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;color:var(--ink);opacity:.92;text-wrap:balance}
.ashara{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:10px 14px}
.ashara .l{display:contents}
.ashara .t2{grid-row:1;grid-column:1;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ashara .t3{grid-row:2;grid-column:1;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ashara .cd{grid-row:1/3;grid-column:2;align-self:center;font-size:15px;font-weight:700;color:var(--on-brand);background:var(--brand);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ashara .cd small{font-size:11px;font-weight:600;opacity:.8;margin-left:1px}
.ashara .bar{grid-row:3;grid-column:1/-1;height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.ashara .bar i{display:block;height:100%;background:var(--gold)}
.infobtn{border:1px solid var(--line);background:var(--chip);color:var(--brand);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;padding:0;cursor:pointer;flex:none}
.infobtn[aria-expanded=true]{background:var(--brand);color:var(--on-brand)}
.remrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.remrow:first-child{border-top:0}
.remrow.isOn{opacity:.92}
.remrow input:disabled{opacity:1;accent-color:var(--brand)}
.rmundo{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px}
.remrow input{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.remrow .ri{font-size:20px}
.remrow .rt{flex:1;line-height:1.3}
.upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:20;max-width:616px;margin:0 auto;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);transform:translateY(-150%);transition:transform .3s ease}
.upd.on{transform:none}
.upd .m{flex:1;font-size:14px;line-height:1.3;min-width:0}
.upd .m .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;opacity:.92}
.upd button{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;background:var(--on-brand);color:var(--brand)}
.upd .x{background:none;color:inherit;opacity:.8;padding:6px;font-size:18px}
.wn li{margin:6px 0}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
.install{display:none}
.banner{border-left:4px solid var(--gold);cursor:pointer}
.banner .when{font-size:12px;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.banner{padding:9px 12px}.banner .mq{display:flex;align-items:baseline;gap:8px;padding:3px 0;white-space:nowrap;overflow:hidden}.banner .when{flex:none;font-size:11px}.banner .t{font-weight:600;font-size:14px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
a.btn{text-decoration:none;display:inline-block}
h4.plat{margin:14px 0 2px;font-size:14px}
.dua-item{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.dua-ic{width:46px;height:46px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:24px}
.dua-go{font-size:26px;color:var(--brand)}
.dua-item .muted{font-size:13px}
.ghnow{font-weight:600;margin:4px 0 8px;font-size:14px}
.gh{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;font-size:14px}
.gh:nth-child(odd){background:var(--bg)}
.gh .no{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.gh .tm{font-variant-numeric:tabular-nums}
.gh .pl{display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right}
.gh .pl i{width:10px;height:10px;border-radius:50%;flex:none}
.gh.cur{outline:2px solid var(--brand);background:var(--chip)!important;font-weight:700}
.lv-vgood{background:#1f9d55} .lv-good{background:#5bb974} .lv-normal{background:#d4a72c} .lv-unfav{background:#d14b4b}
#ghToggle button{font-size:12px;padding:6px 10px}
.acc>.acc-h{display:flex;align-items:center;gap:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.acc>.acc-h>h3,.acc>h3.acc-h{flex:1;margin:0!important}
/* long header (times + next miqaat) only on Calendar / Miqaats: more room for Dua, Ziyarat, Salaat, Settings */
html[data-view]:not([data-view=cal]):not([data-view=up]) .top .tstrip,html[data-view]:not([data-view=cal]) .top .nextmq{display:none}
/* Salaat page repeats the date and city in its own card: drop the header there; Miqaats list already shows the next miqaat */
html[data-view=sl] header.top,html[data-view=sl] #miniBar{display:none}
.acc>.acc-h::after{content:"›";font-size:22px;line-height:1;color:var(--muted);transition:transform .2s;transform:rotate(90deg)}
.acc.open>.acc-h::after{transform:rotate(-90deg)}
.acc>.acc-b{display:none;margin-top:10px}
.acc.open>.acc-b{display:block}
.acc>.acc-h>.infobtn{order:2}
h3.sec{margin:16px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rz{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rz:first-child{border-top:0}
.rz .d{min-width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px}
.rz .d.ar{font-size:19px;font-weight:400}
.rz.today{background:var(--chip);border-radius:10px}
.rz.today .d{background:var(--brand);color:var(--on-brand)}
.rz .n{flex:1;font-weight:600}
.rz .go{color:var(--brand);font-size:20px}
.cal th{white-space:nowrap;overflow:hidden;text-overflow:clip}
.lang{display:flex;width:max-content;margin:0 0 8px auto;background:var(--hdr-chip);border-radius:9px;padding:2px}
.lang button,.langset button{border:0;background:none;color:inherit;font:inherit;font-size:12px;font-weight:600;padding:5px 8px;border-radius:7px;opacity:.8}
.lang button.on{background:#fff;color:var(--hdr-on);opacity:1}
.langset{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.langset button{font-size:14px;padding:8px 12px;color:var(--ink)}
.langset button.on{background:var(--brand);color:var(--on-brand);opacity:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;font:inherit;font-size:14px}
.sw.on{border-color:var(--brand);font-weight:700}
.sw i{width:22px;height:22px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}

/* frosted bottom tabs + compact top bar that appears when the big header scrolls away */
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  nav.tabs{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6)}
  #miniBar{background:color-mix(in srgb,var(--hdr) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5)}
}
#miniBar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--hdr);color:var(--hdr-ink);font-size:13px;transform:translateY(-110%);transition:transform .25s;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#miniBar.on{transform:none;pointer-events:auto}
#miniBar b{font-weight:700} #miniBar span:last-child{opacity:.9;white-space:nowrap}
#miniBar span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:1000px){#miniBar{left:var(--sbw);padding-left:24px;padding-right:24px}}
/* ---- bottom tabs: modern pill indicator ---- */
nav.tabs{background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding-top:4px}
nav.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;font-size:11px;font-weight:600;color:var(--muted);transition:color .2s;-webkit-tap-highlight-color:transparent}
nav.tabs button .i{display:grid;place-items:center;width:58px;height:30px;border-radius:16px;font-size:20px;line-height:1;transition:background .25s,transform .25s,filter .25s}
nav.tabs button:not(.on) .i{filter:grayscale(.85) opacity(.7)}
nav.tabs button.on{color:var(--brand);font-weight:800}
nav.tabs button.on .i{background:color-mix(in srgb,var(--brand) 18%,transparent);transform:translateY(-1px) scale(1.06);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 35%,transparent)}
nav.tabs button.on::before{content:"";position:absolute;top:-5px;left:50%;width:30px;height:3px;margin-left:-15px;border-radius:0 0 4px 4px;background:var(--brand)}
nav.tabs button:active .i{transform:scale(.92)}
/* ================= Responsive / web layout ================= */
/* keyboard + mouse niceties (all sizes) */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
button,a,.mrow,.cal td,.dua-item{cursor:pointer}
@media (hover:hover){
  .card[href]:hover,.dua-item:hover,.banner:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-1px)}
  .card[href],.dua-item,.banner{transition:box-shadow .15s,transform .15s}
  .btn:hover{filter:brightness(1.08)} .btn.ghost:hover{filter:brightness(.96)}
  .cal td:not(.filler):not(.empty):not(.today):hover{background:color-mix(in srgb,var(--brand) 12%,transparent)}
  .mrow:hover,.rz:hover,.slr:hover:not(.nx){background:var(--chip);border-radius:10px}
  nav.tabs button:hover:not(.on){color:var(--ink)}
  .langset button:hover:not(.on),.sw:hover{filter:brightness(.96)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ---- tablet and up: wider column, centred sheets, two-column Dua list ---- */
@media (min-width:700px){
  main{max-width:800px;padding-top:16px}
  .top .hd,.top .hstrip,.top .tstrip,.top .nextmq{padding-left:max(18px,calc((100% - 800px)/2 + 12px));padding-right:max(18px,calc((100% - 800px)/2 + 12px))}
  .top .lang{margin-right:max(12px,calc((100% - 800px)/2 + 12px))}

  #v-dua>h3.sec,#v-dua>#quranList,#v-dua>:not(a.card):not(h3){grid-column:1/-1}
  .sheet,.csheet{left:0;right:0;margin:0 auto;width:min(580px,100%);border-radius:20px}

  .upd{max-width:580px}
  .cal td{height:62px} .cal td .h{font-size:22px} .cal td .h.ar{font-size:23px} .cal td .g{font-size:10px}

}

/* ---- desktop: sidebar navigation, two-column Today screen, two-column Settings ---- */
@media (min-width:1000px){
  :root{--sbw:232px}
  body{padding-left:var(--sbw);padding-bottom:30px}

  nav.tabs::before{content:"🌙  Mumin";display:block;font-size:22px;font-weight:800;color:var(--brand);padding:2px 14px 18px;letter-spacing:.2px}
  nav.tabs button{flex:none;display:flex;align-items:center;gap:14px;text-align:left;font-size:15px;padding:12px 14px;border-radius:12px;width:100%}
  nav.tabs button .i{display:inline;font-size:20px;width:26px;text-align:center}
  nav.tabs button.on{background:color-mix(in srgb,var(--brand) 12%,transparent)}
  main{max-width:1120px;padding:20px 24px 0}
  .top .hd,.top .hstrip,.top .tstrip,.top .nextmq{padding-left:max(24px,calc((100% - 1120px)/2 + 24px));padding-right:max(24px,calc((100% - 1120px)/2 + 24px))}
  .top .lang{margin-right:max(24px,calc((100% - 1120px)/2 + 24px))}

}

<body>
<div id="topcap"></div>
<div class="instbar" id="instBar" hidden><span>📲 <b data-i18n="instBar"></b></span><button id="instBtn" data-i18n="instBtn"></button><button class="x" id="instX" aria-label="Close">×</button></div>
<header class="top">
  <div class="hd" style="cursor:pointer">
    <div class="gcol"><div class="wdn" id="tWd"></div><div class="big" id="tGd"></div><div class="my" id="tGmy"></div></div>
    <div class="hcol"><div class="big ar" id="tHd"></div><div class="hm ar" dir="rtl" id="tHijriAr"></div><div class="my" id="tHijri"></div></div>
  </div>
  <div class="hstrip"><span id="tLoc"></span><button id="locBtn" hidden></button><span id="tEve"></span></div>
  <div class="tstrip" id="tStrip" role="link" tabindex="0" style="cursor:pointer"></div>
  <div class="nextmq" id="tNext"></div>
</header>

<main>
  <!-- CALENDAR -->
  <section class="view on" id="v-cal">
    <div class="card banner" id="banner" style="display:none"></div>
    <div class="card qcard" id="qCard"></div>
    <div class="card">
      <div class="monthbar">
        <button id="prev" aria-label="Previous month">‹</button>
        <div class="title" id="mTitle"></div>
        <button id="next" aria-label="Next month">›</button>
      </div>
      <table class="cal" id="cal"></table>
      <div class="key" id="calKey"></div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" id="goToday" data-i18n="today"></button></div>
    </div>
    <div class="card" id="monthMq"></div>
    <div class="card" id="todayMq"></div>
    <div class="card">
      <h3><span data-i18n="timesH"></span> <span class="tag" id="locName"></span></h3>
      <div class="times" id="times"></div>
      <p class="muted" data-i18n="timesNote"></p>
    </div>
    <div class="card" id="ghadiCard">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h3 style="margin:0">⏳ <span data-i18n="ghH"></span> <span class="tag" id="ghLoc"></span></h3>
        <div class="langset" id="ghToggle"></div>
      </div>
      <div class="ghnow" id="ghNow"></div>
      <div id="ghList"></div>
      <p class="muted" style="font-size:11px" data-i18n="ghNote"></p>
    </div>
  </section>

  <!-- UPCOMING -->
  <section class="view" id="v-up">
    <div class="card">
      <h3 data-i18n="upH"></h3>
      <div class="row" style="margin-bottom:6px">
        <select id="upFilter">
          <option value="1" data-i18n="upMajor"></option>
          <option value="3" selected data-i18n="upAll"></option>
        </select>
        <select id="upRange">
          <option value="30" data-i18n="nDays" data-n="30"></option>
          <option value="90" selected data-i18n="nDays" data-n="90"></option>
          <option value="365" data-i18n="oneYear"></option>
        </select>
      </div>
      <div id="upList"></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="toRem" data-i18n="toRem"></button></div>
    </div>
  </section>

<script>
"use strict";

const ARD = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
const arNum = n => String(n).replace(/\d/g, c => ARD[c]);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- Language ---------- */
const LANGS = ["en", "gu", "hi"];
let lang = store.get("lang", "en");
if (!LANGS.includes(lang)) lang = "en";
let L = I18N[lang];
const t = (k, v = {}) => String(L[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");

function applyStatic() {
  document.documentElement.lang = lang === "gu" ? "gu" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n, { n: el.dataset.n }); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  const btns = cur => LANGS.map(k => `<button data-l="${k}" class="${k === cur ? "on" : ""}">${I18N[k]._label}</button>`).join("");
  $("langSet").innerHTML = btns(lang);
  $("numSet").innerHTML = [["en", "12"], ["ar", "١٢"]].map(([k, x]) => `<button data-num="${k}" class="${k === numStyle ? "on" : ""}">${x}</button>`).join("");
}
let numStyle = store.get("num", "ar");
const hNum = n => numStyle === "ar" ? arNum(n) : String(n);
document.addEventListener("click", e => { const b = e.target.closest("[data-num]"); if (b) { numStyle = b.dataset.num; store.set("num", numStyle); applyStatic(); renderCal(); } });
function setLang(k) {
  lang = k; L = I18N[k]; store.set("lang", k);
  applyStatic(); applyTheme(); renderAll();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) setLang(b.dataset.l); });

/* ---------- Theme ---------- */
const THEMES = { gold: "#c9a227", green: "#0f5132", maroon: "#7a1f2b", navy: "#1d3a6e", teal: "#0e6e6a", rose: "#f4b6ca", sky: "#a9d4f2", lavender: "#cbb9f0" };
const MODES = ["auto", "light", "dark"];
let theme = store.get("theme", "maroon"); if (!THEMES[theme]) theme = "maroon";
let mode = store.get("mode", "light"); if (!MODES.includes(mode)) mode = "light";
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const r = document.documentElement;
  r.setAttribute("data-theme", theme);
  r.classList.toggle("dark", mode === "dark" || (mode === "auto" && darkMQ.matches));
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(r).getPropertyValue("--hdr").trim();
  if (window.MuminNative && MuminNative.setBars) try { MuminNative.setBars(getComputedStyle(r).getPropertyValue("--hdr").trim()); } catch {}
  $("themeSet").innerHTML = Object.entries(THEMES).map(([k, c]) => `<button class="sw ${k === theme ? "on" : ""}" data-theme-k="${k}"><i style="background:${c}"></i>${t("th_" + k)}</button>`).join("");
  $("modeSet").innerHTML = MODES.map(k => `<button data-mode-k="${k}" class="${k === mode ? "on" : ""}">${t("md_" + k)}</button>`).join("");
}
darkMQ.addEventListener?.("change", applyTheme);
document.addEventListener("click", e => {

/* ---------- Miqaats ---------- */
let MIQ = [];
const miqaatsFor = (y, m, d) => {
  const e = MIQ.find(x => x.month === m && x.date === d);
  return e ? e.miqaats.filter(q => !q.year || q.year <= y).sort((a, b) => a.priority - b.priority) : [];
};

/* ---------- Sun times (NOAA) ---------- */
function sunTimes(Y, M, D, lat, lng) {
  const rad = Math.PI / 180;
  const jd = H.gToAJD(Y, M, D) + 0.5 - lng / 360; // ~local noon
  const T = (jd - 2451545) / 36525;
  const L0 = (280.46646 + T * (36000.76983 + 0.0003032 * T)) % 360;
  const Ma = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const C = Math.sin(Ma * rad) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * Ma * rad) * (0.019993 - 0.000101 * T) + Math.sin(3 * Ma * rad) * 0.000289;
  const lam = L0 + C - 0.00569 - 0.00478 * Math.sin((125.04 - 1934.136 * T) * rad);
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos((125.04 - 1934.136 * T) * rad);
  const decl = Math.asin(Math.sin(eps * rad) * Math.sin(lam * rad));
  const yv = Math.tan(eps / 2 * rad) ** 2;
  const eqt = 4 / rad * (yv * Math.sin(2 * L0 * rad) - 2 * e * Math.sin(Ma * rad) + 4 * e * yv * Math.sin(Ma * rad) * Math.cos(2 * L0 * rad) - 0.5 * yv * yv * Math.sin(4 * L0 * rad) - 1.25 * e * e * Math.sin(2 * Ma * rad));
  const noon = 720 - 4 * lng - eqt; // minutes UTC
  const cosH = (Math.cos(90.833 * rad) - Math.sin(lat * rad) * Math.sin(decl)) / (Math.cos(lat * rad) * Math.cos(decl));
  const ha = Math.acos(Math.max(-1, Math.min(1, cosH))) / rad;
  const at = min => new Date(Date.UTC(Y, M, D) + min * 6e4);
  return { sunrise: at(noon - 4 * ha), noon: at(noon), sunset: at(noon + 4 * ha) };
}
const fmtT = d => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", ...(loc.tz ? { timeZone: loc.tz } : {}) });

const locLabel = () => loc.key === "auto" ? (loc.city || (loc.lat === DEFAULT_LOC.lat && loc.lng === DEFAULT_LOC.lng ? t("locIndore") : t("locGps"))) : (loc.city || t({ indore: "locIndore", gps: "locGps" }[loc.key] || "locCustom"));
const now = new Date();

const wd = a => L.wd[H.dow(a)];

/* ---------- Header ---------- */

  const g = H.ajdToG(todayAJD), n = new Date();
  $("tWd").textContent = wd(todayAJD);
  $("tGd").textContent = String(g.d).padStart(2, "0");

  $("tLoc").textContent = "📍 " + locLabel();

  const s2h = sunTimes(n.getFullYear(), n.getMonth(), n.getDate() + 1, loc.lat, loc.lng);
  const asrEnd = new Date(s.noon.getTime() + (s.sunset - s.noon) * 2 / 3);   // aajnodin: Zohar end / Asar end split Zawaal→Maghrib in thirds
  const nisfH = new Date((s.sunset.getTime() + s2h.sunrise.getTime()) / 2);
  const tl = [["tSunrise", s.sunrise], ["tZawaal", s.noon], ["tAsrEnd", asrEnd], ["tMaghrib", s.sunset], ["tNisf", nisfH]];

  $("tStrip").innerHTML = tl.map(([k, d], i) => `<span class="${i === nx ? "nx" : ""}">${t(k)}<b>${fmtT(d)}</b></span>`).join("");
}

/* ---------- Calendar grid ---------- */
function renderCal() {
  const { y, m } = view;
  const first = H.toAJD(y, m, 1), n = H.daysInMonth(y, m);
  const lead = H.dow(first);
  const cells = [];
  for (let i = lead; i > 0; i--) cells.push({ ajd: first - i, filler: true });
  for (let i = 0; i < n; i++) cells.push({ ajd: first + i });
  while (cells.length % 7) cells.push({ ajd: first + n + (cells.length - lead - n), filler: true });

  const g1 = H.ajdToG(first), g2 = H.ajdToG(first + n - 1);
  $("mTitle").innerHTML = `<b>${L.hijriMonths[m]} ${y}${L.hSuffix}</b><span class="ar" dir="rtl">${H.AR[m]} ${arNum(y)}</span>
    <span>${L.gShort[g1.m]} ${g1.y === g2.y ? "" : g1.y + " "}– ${L.gShort[g2.m]} ${g2.y}${H.isKabisa(y) ? " · " + t("leap") : ""}</span>`;

  let html = "<thead><tr>" + L.wdShort.map((d, i) => `<th class="${i === 5 ? "fri" : ""}">${d}</th>`).join("") + "</tr></thead><tbody>";
  cells.forEach((c, i) => {
    if (i % 7 === 0) html += "<tr>";
    const h = H.fromAJD(c.ajd), g = H.ajdToG(c.ajd);
    const gl = (h.d === 1 || g.d === 1) && !c.filler ? `<b>${L.gShort[g.m]}</b> ${g.d}` : String(g.d);
    let cls = c.filler ? "filler" : "";
    if (i % 7 === 5) cls += " fri";
    if (c.ajd === todayAJD) cls += " today";
    if (c.ajd === selAJD) cls += " sel";
    let dot = "", rzm = "";
    if (!c.filler) {
      const qs = miqaatsFor(h.y, h.m, h.d);
      const top = qs[0];
      if (top && top.priority === 1) cls += top.phase === "night" ? " mq1n" : " mq1";
      if (ROZI.some(r => r[0] === h.d)) { cls += " rzd"; rzm = '<span class="rzm">📖</span>'; }
      if (qs.length) dot = `<span class="dot">${qs.slice(0, 3).map(q => `<i class="${q.priority === 1 ? (q.phase === "night" ? "n" : "d") : ""}"></i>`).join("")}</span>`;
    }
    html += `<td class="${cls}" data-a="${c.ajd}">${rzm}<span class="g">${gl}</span><div class="h${numStyle === "ar" ? " ar" : ""}">${hNum(h.d)}</div>${dot}</td>`;
    if (i % 7 === 6) html += "</tr>";
  });
  $("cal").innerHTML = html + "</tbody>";
  $("calKey").innerHTML = `<span><span class="s">${hNum(12)}<small>3</small></span>${t("keyNums")}</span>
    <span><span class="ksw" style="background:color-mix(in srgb,var(--gold) 35%,transparent)"></span>${t("legendDay")}</span>
    <span><span class="ksw" style="background:color-mix(in srgb,var(--night) 28%,transparent)"></span>${t("legendNight")}</span>
    <span><span class="ksw" style="width:6px;height:6px;border-radius:50%;background:var(--brand-2);vertical-align:1px"></span>${t("legendOther")}</span>
    <span><span class="ksw" style="background:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,#2e8b57 70%,transparent)"></span>📖 ${t("keyRozi")}</span>`;
  renderMonthMq();
}

function renderMonthMq() {
  const { y, m } = view, first = H.toAJD(y, m, 1);
  let rows = "";
  for (let d = 1; d <= H.daysInMonth(y, m); d++) {
    const qs = miqaatsFor(y, m, d); if (!qs.length) continue;
    const a = first + d - 1, g = H.ajdToG(a), top = qs[0];
    const cls = (top.priority === 1 ? (top.phase === "night" ? "p1n" : "p1") : "") + (a < todayAJD ? " past" : "");
    rows += `<div class="mrow ${cls}" data-a="${a}"><div class="dd"><b>${hNum(d)}</b><span>${g.d} ${L.gShort[g.m]}</span></div>
      <div class="tt">${qs.map(q => `<div>${icon(q)}${esc(q.title)}${nightTag(q)}</div>`).join("")}<div class="sub">${wd(a)}</div></div></div>`;
  }
  $("monthMq").innerHTML = `<h3>${t("monthMq", { m: L.hijriMonths[m] })}</h3><div class="mlist">${rows || `<p class="muted">${t("noMq")}</p>`}</div>`;
}

const icon = q => q.priority === 1 ? (q.phase === "night" ? "☾ " : "☀ ") : "";
const nightTag = q => q.phase === "night" ? `<span class="tag">${t("nightTag")}</span>` : "";
function mqHTML(list) {
  if (!list.length) return `<p class="muted">${t("noMq")}</p>`;
  return list.map(q => `<div class="mq"><div class="t">${icon(q)}${esc(q.title)}${nightTag(q)}</div>${q.description ? `<div class="d">${esc(q.description)}</div>` : ""}</div>`).join("");
}

function renderTodayMq() {
  $("todayMq").innerHTML = `<h3>${t("todayMq")}</h3>${mqHTML(miqaatsFor(todayH.y, todayH.m, todayH.d))}`;
}

function todayIn() {   // today's civil date at the chosen city (device date when no city time zone is set)
  const n = new Date(); if (!loc.tz) return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  try { const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: loc.tz, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(n).map(x => [x.type, x.value])); return new Date(+p.year, +p.month - 1, +p.day); } catch { return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
}
function salatList(d0) {   // the 8 timings of the local date d0, as on aajnodin
  const s = sunTimes(d0.getFullYear(), d0.getMonth(), d0.getDate(), loc.lat, loc.lng);
  const t2 = new Date(d0); t2.setDate(t2.getDate() + 1);
  const s2 = sunTimes(t2.getFullYear(), t2.getMonth(), t2.getDate(), loc.lat, loc.lng);
  const nisf = new Date((s.sunset.getTime() + s2.sunrise.getTime()) / 2);
  const zEnd = new Date(s.noon.getTime() + (s.sunset - s.noon) / 3), aEnd = new Date(s.noon.getTime() + (s.sunset - s.noon) * 2 / 3);
  const fe = new Date(s.sunrise.getTime() + 60e3), fj = new Date(fe.getTime() - 65 * 6e4), sih = new Date(fj.getTime() - 10 * 6e4);   // Fajr ≈ sunrise − 65 min, Sihori = Fajr − 10 min
  return [["tSihori", sih], ["tFajr", fj], ["tFajrEnd", fe], ["tZawaal", s.noon], ["tZohrEnd", zEnd], ["tAsrEnd", aEnd], ["tMaghrib", s.sunset], ["tIshaEnd", nisf]];
}
function renderTimes() {
  const items = salatList(todayIn());
  $("times").innerHTML = items.map(([k, v]) => `<div><small>${t(k)}</small><b>${fmtT(v)}</b></div>`).join("");
  $("locName").textContent = locLabel();
  $("locCur").textContent = t("locNow", { name: locLabel(), lat: loc.lat.toFixed(4), lng: loc.lng.toFixed(4) });
}

/* ---------- Salaat timings: home card + dedicated page ---------- */
let slOff = 0;   // days from today shown on the page
function nextSalat() {   // [key, Date] of the next timing from now (tomorrow's Sihori after Isha end)
  const n = new Date(), d = todayIn(), tm = new Date(d); tm.setDate(tm.getDate() + 1);
  const all = salatList(d).concat([salatList(tm)[0]]);
  return all.find(x => x[1] > n) || all[all.length - 1];
}
const fmtLeft = ms => { const m = Math.max(0, Math.round(ms / 6e4)), h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; };
const SL_IC = { tSihori: "🌙", tFajr: "🌅", tFajrEnd: "🌄", tZawaal: "☀️", tZohrEnd: "🌤️", tAsrEnd: "🌇", tMaghrib: "🌆", tIshaEnd: "🌌" };
function renderSalatPage() {
  const n = new Date(), td = todayIn(), d0 = new Date(td.getFullYear(), td.getMonth(), td.getDate() + slOff);
  const items = salatList(d0), ajd = H.gToAJD(d0.getFullYear(), d0.getMonth(), d0.getDate()), h = H.fromAJD(ajd);
  const nx = slOff === 0 ? items.findIndex(x => x[1] > n) : -1, cur = slOff === 0 ? (nx < 0 ? items.length - 1 : nx - 1) : -1;
  $("slDate").innerHTML = `<b>${wd(ajd)}, ${d0.getDate()} ${L.gShort[d0.getMonth()]} ${d0.getFullYear()}</b><br>${h.d} ${L.hijriMonths[h.m]} ${h.y}${L.hSuffix}`;
  $("slLoc").textContent = locLabel();
  $("slList").innerHTML = items.map(([k, v], i) => `<div class="slr${i === nx ? " nx" : ""}${i === cur ? " cur" : ""}${slOff === 0 && i < cur ? " done" : ""}"><span class="ic">${SL_IC[k] || "🕌"}</span><span class="nm">${t(k)}${i === nx ? `<small>${t("slNext")} · ${t("slIn", { t: fmtLeft(v - n) })}</small>` : i === cur ? `<small>${t("slNow")}</small>` : ""}</span><b>${fmtT(v)}</b></div>`).join("");
  $("slToday").hidden = false; $("slToday").style.opacity = slOff === 0 ? ".55" : "1";
  const ring = $("slRing");
  if (slOff !== 0) { ring.style.display = "none"; return; }
  ring.style.display = "";
  let nk, nd, pd;
  if (nx >= 0) { nk = items[nx][0]; nd = items[nx][1]; pd = nx > 0 ? items[nx - 1][1] : (() => { const y = new Date(d0); y.setDate(y.getDate() - 1); return salatList(y)[7][1]; })(); }
  else { const tm = new Date(d0); tm.setDate(tm.getDate() + 1); const f = salatList(tm)[0]; nk = f[0]; nd = f[1]; pd = items[7][1]; }
  const p = Math.min(1, Math.max(0, (n - pd) / (nd - pd)));
  $("slNextL").textContent = t("slNext") + " · " + t(nk);
  $("slNextT").textContent = fmtT(nd);
  $("slLeft").textContent = t("slIn", { t: fmtLeft(nd - n) });
  $("slArc").style.strokeDashoffset = (326.7 * (1 - p)).toFixed(1);
}
/* city picker */
function fmtOff(tz) {   // e.g. "UTC+5:30"
  try { const p = new Intl.DateTimeFormat("en", { timeZone: tz, timeZoneName: "shortOffset" }).formatToParts(new Date()).find(x => x.type === "timeZoneName"); return (p ? p.value : "").replace("GMT", "UTC"); } catch { return ""; }
}

let cLock = null;
function lockBodyC() { if (cLock != null) return; cLock = scrollY; const b = document.body.style; b.position = "fixed"; b.top = -cLock + "px"; b.left = "0"; b.right = "0"; b.width = "100%"; }
function closeCity() { $("citySheet").classList.remove("on"); $("cityBg").style.display = "none"; if (cLock != null) { const y = cLock; cLock = null; const b = document.body.style; b.position = b.top = b.left = b.right = b.width = ""; scrollTo(0, y); } }

/* ---------- Ghadi (planetary hours, as on aajnodin.com / Busaheba Sahifa) ---------- */
// Chaldean order; first day-ghadi of each weekday: Sun=Shams, Mon=Qamar, Tue=Mirrikh, Wed=Atarad, Thu=Mushtari, Fri=Zahrat, Sat=Zuhal
const GH_LV = ["good", "vgood", "normal", "good", "unfav", "vgood", "unfav"];
const GH_FIRST = [0, 3, 6, 2, 5, 1, 4];
let ghMode = null; // "day" | "night"; null = follow the clock
function ghadiOf(d0, night) {  // d0 = local date of the day whose day/night we want
  const s = sunTimes(d0.getFullYear(), d0.getMonth(), d0.getDate(), loc.lat, loc.lng);
  const n = new Date(d0); n.setDate(n.getDate() + 1);
  const s2 = sunTimes(n.getFullYear(), n.getMonth(), n.getDate(), loc.lat, loc.lng);
  const a = night ? s.sunset : s.sunrise, b = night ? s2.sunrise : s.sunset, len = (b - a) / 12;
  const first = GH_FIRST[d0.getDay()] + (night ? 12 : 0);
  return Array.from({ length: 12 }, (_, k) => ({ k: k + 1, from: new Date(+a + len * k), to: new Date(+a + len * (k + 1)), p: (first + k) % 7 }));
}
function renderGhadi() {
  const nowD = new Date(), today = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate());
  const st = sunTimes(today.getFullYear(), today.getMonth(), today.getDate(), loc.lat, loc.lng);
  // which day/night are we in right now?
  let curBase = today, curNight = false;
  if (nowD >= st.sunset) curNight = true;
  else if (nowD < st.sunrise) { curBase = new Date(today); curBase.setDate(curBase.getDate() - 1); curNight = true; }
  const night = ghMode ? ghMode === "night" : curNight;
  const base = night === curNight ? curBase : today;
  const list = ghadiOf(base, night);
  const cur = ghadiOf(curBase, curNight).find(g => nowD >= g.from && nowD < g.to);
  $("ghToggle").innerHTML = ["day", "night"].map(m => `<button data-gh="${m}" class="${(night ? "night" : "day") === m ? "on" : ""}">${t(m === "day" ? "ghDay" : "ghNight")}</button>`).join("");
  $("ghNow").innerHTML = cur ? `<span class="pl"><i class="lv-${GH_LV[cur.p]}" style="display:inline-block;width:10px;height:10px;border-radius:50%"></i></span> ` + t("ghNow", { p: L.ghP[cur.p], l: L.ghL[GH_LV[cur.p]], t: fmtT(cur.to) }) : "";
  $("ghList").innerHTML = list.map(g => `<div class="gh ${cur && +g.from === +cur.from ? "cur" : ""}"><span class="no">${g.k}</span><span class="tm">${fmtT(g.from)} – ${fmtT(g.to)}</span><span class="pl">${L.ghP[g.p]} · ${L.ghL[GH_LV[g.p]]}<i class="lv-${GH_LV[g.p]}"></i></span></div>`).join("");
  $("ghLoc").textContent = `${L.wd[base.getDay()]} · ${locLabel()}`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-gh]"); if (b) { ghMode = b.dataset.gh; renderGhadi(); } });
setInterval(() => { if (document.visibilityState === "visible") renderGhadi(); }, 60000);

/* ---------- Day sheet ---------- */
function openDay(ajd) {
  selAJD = ajd; renderCal();
  const h = H.fromAJD(ajd), g = H.ajdToG(ajd);
  const s = sunTimes(g.y, g.m, g.d, loc.lat, loc.lng);
  $("sheetBody").innerHTML = `<div style="font-size:20px;font-weight:700">${hStr(h)}</div>

  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSW && !reloaded && !wnOpen) { reloaded = true; location.reload(); } });
}
document.addEventListener("click", e => { const b = e.target.closest("[data-img]"); if (b) { $("imgView").querySelector("img").src = b.dataset.img; $("imgView").classList.add("on"); } });
$("imgView").onclick = e => { if (e.target.tagName !== "IMG") $("imgView").classList.remove("on"); };

/* ---------- Ashara Mubaraka countdown ---------- */
// Ashara = 1–10 Muharram. A Misri day begins at the previous Maghrib, so 1 Muharram starts at
// sunset on the Gregorian eve. Before it: live countdown; during 1–10: "day n of 10"; then next year.
function asharaStart(y) {
  const g = H.ajdToG(H.toAJD(y, 0, 1) - 1);
  return { y, a: H.toAJD(y, 0, 1), at: sunTimes(g.y, g.m, g.d, loc.lat, loc.lng).sunset };
}
function renderAshara() {
  const nowT = new Date(), cur = H.fromAJD(todayAJD);
  const s = sunTimes(nowT.getFullYear(), nowT.getMonth(), nowT.getDate(), loc.lat, loc.lng);
  const hNow = H.fromAJD(todayAJD + (nowT > s.sunset ? 1 : 0)); // after Maghrib = next Hijri day
  const el = $("tNext");
  el.dataset.a = hNow.m === 0 && hNow.d <= 10 ? todayAJD + (nowT > s.sunset ? 1 : 0) : "";
  if (hNow.m === 0 && hNow.d <= 10) {
    const n = hNow.d;
    el.innerHTML = `<small>🕌 ${t("ashName")} ${hNow.y}${L.hSuffix}</small>${n === 10 ? t("ashAshura") : t("ashLeft", { n: 10 - n })} · <b>${n}/10</b>`;
    return;
  }
  let st = asharaStart(cur.m === 0 ? cur.y + 1 : cur.y + 1);
  if (cur.m === 0 && cur.d > 10) st = asharaStart(cur.y + 1);
  if (st.at <= nowT) st = asharaStart(st.y + 1);
  const sec = Math.floor((st.at - nowT) / 1000), p2 = v => String(v).padStart(2, "0");
  const D = Math.floor(sec / 86400), Hh = Math.floor(sec % 86400 / 3600), M = Math.floor(sec % 3600 / 60), S = sec % 60;
  const g = H.ajdToG(st.a - 1);
  el.dataset.a = st.a;
  el.innerHTML = `<small>🕌 ${t("ashName")} ${st.y}${L.hSuffix}</small><b style="letter-spacing:.06em;font-variant-numeric:tabular-nums">${D}${t("ashDs")}&ensp;${p2(Hh)} : ${p2(M)} : ${p2(S)}</b>`;
}
setInterval(() => { if (document.visibilityState === "visible" && curView === "cal") renderAshara(); }, 1000);
setInterval(() => { if (document.visibilityState === "visible") renderHeader(); }, 60000);
$("tStrip").onclick = () => switchView("sl");
$("tNext").onclick = () => { const a = +$("tNext").dataset.a, h = a && H.fromAJD(a); if (!a) return; view = { y: h.y, m: h.m }; switchView("cal"); renderCal(); setTimeout(() => { const c = $("cal").closest(".card"); c.style.scrollMarginTop = "calc(env(safe-area-inset-top) + 64px)"; c.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60); openDay(a); };
document.querySelector(".top .hd").onclick = () => { if (curView !== "cal") switchView("cal"); setTimeout(() => (c => { c.style.scrollMarginTop = "calc(env(safe-area-inset-top) + 64px)"; c.scrollIntoView({ behavior: "smooth", block: "start" }); })($("cal").closest(".card")), 60); };

/* ---------- "Install app" button (mobile browser only) ---------- */
// Hidden when already installed (standalone), on desktop, or after the user closed it (shown again after 7 days).
let deferredInstall = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /android|mobile/i.test(navigator.userAgent);
function updInstBar() {
  const hideUntil = store.get("instHide", 0);
  $("instBar").hidden = isStandalone() || !isMobile || Date.now() < hideUntil;
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener("appinstalled", () => { deferredInstall = null; $("instBar").hidden = true; });
$("instX").onclick = () => { store.set("instHide", Date.now() + 7 * 864e5); updInstBar(); };
$("instBtn").onclick = async () => {
  if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; updInstBar(); return; }
  // iPhone (or a browser without the prompt): show the steps
  $("sheetBody").innerHTML = `<div style="font-size:20px;font-weight:700">📲 ${t("installH")}</div>
    <h4 class="plat">${t(isIOS ? "platIphone" : "platAndroid")}</h4>
    <ol class="muted" style="font-size:14px;padding-left:18px;margin:0">${t(isIOS ? "installSteps" : "installAndroidSteps")}</ol>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="instOk">${t("updOk")}</button></div>`;
  $("sheetBg").style.display = "block"; requestAnimationFrame(() => $("sheet").classList.add("on"));
  $("instOk").onclick = closeSheet;
};
updInstBar();

/* swipe down on the sheet to close it (works from the handle, or from the top of the scrolled content) */
function dismissSheet() { if (wnOpen) { wnOpen = false; store.set("seenVer", APP_V); } closeSheet(); }   // OK button or swipe: the update note counts as read
(() => {
  const sh = $("sheet"); let y0 = null, dy = 0, drag = false, sc = null;
  sh.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; drag = false; sc = e.target.closest(".wnscroll") || sh; }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (!drag && dy > 8 && sc.scrollTop <= 0) { drag = true; sh.style.transition = "none"; }
    if (drag) { sh.style.transform = `translateY(${Math.max(0, dy)}px)`; e.preventDefault(); }
  }, { passive: false });
  const end = () => {
    if (drag) { sh.style.transition = ""; sh.style.transform = ""; if (dy > 90) dismissSheet(); }
    y0 = null; drag = false;
  };
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
})();

/* ---------- Update notification ---------- */
// version.json is bumped with every deploy. If the server has a newer one than this code, show an
// "update available" bar; after the update loads, show "what's new" once (versions newer than last seen).
const notesOf = e => e[lang] || e.en || [];
let wnOpen = false;   // the what's-new sheet only closes with its OK button (not by tapping outside, not by itself)
function showWhatsNew(list) {
  wnOpen = true;
  $("sheet").classList.add("wn");
  $("sheetBody").innerHTML = `<div class="wnscroll"><div style="font-size:20px;font-weight:700">🎉 ${t("updDone", { v: vName(APP_V) })}</div>` +
    list.map(e => `<h3 style="margin-top:12px">v${vName(e.v)} <span class="tag">${esc(e.date)}</span></h3><ul class="wn">${notesOf(e).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("") +
    `</div><div class="wnfoot"><button class="btn" id="wnOk">${t("updOk")}</button></div>`;
  $("sheetBg").style.display = "block";
  requestAnimationFrame(() => $("sheet").classList.add("on"));
  $("wnOk").onclick = dismissSheet;
}
function updBar(html) { $("upd").innerHTML = html; $("upd").classList.add("on"); }
$("upd").onclick = e => {
  if (e.target.closest(".x")) { $("upd").classList.remove("on"); return; }
  if (e.target.closest("[data-upd]")) {
    e.target.textContent = "…";
    const go = () => location.reload();
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r ? r.update().then(go, go) : go(), go); else go();
  }
};
let verInfo = null;
let isNewUser = false;   // first ever open on this device: already on the latest version, so no update bar / what's-new
function checkUpdate() {
  if (isNewUser) return;
  fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(j => {
    verInfo = j;
    if (j.v > APP_V) updBar(`<span style="font-size:22px">🔔</span><div class="m"><b>${t("updNew", { v: vName(j.v) })}</b><br><span class="n">${esc(notesOf(j.history.find(e => e.v === j.v) || {})[0] || "")}</span></div><button data-upd>${t("updBtn")}</button><button class="x" aria-label="Close">×</button>`);
  }).catch(() => {});
}
(() => {
  const seen = store.get("seenVer", null);
  if (seen == null) { isNewUser = true; store.set("seenVer", APP_V); }   // brand-new install: nothing to announce
  else if (seen < APP_V) fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json())
    .then(j => { const l = j.history.filter(e => e.v > seen && e.v <= APP_V); if (l.length) showWhatsNew(l); else store.set("seenVer", APP_V); }).catch(() => {});   // seenVer is saved only when OK is pressed
  checkUpdate();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
})();

/* ---------- App tour: spotlight walkthrough for new users (and Settings → Take the app tour) ---------- */
window.tourOn = false;
const TOUR = [
  { i: "🌙", k: 1 },
  { i: "📅", k: 2, sel: "header.top", v: "cal" },
  { i: "🕌", k: 3, sel: "#tStrip", v: "cal" },
  { i: "🗓️", k: 4, sel: "#cal", v: "cal" },
  { i: "⏳", k: 5, sel: 'nav.tabs [data-v="up"]' },
  { i: "🤲", k: 6, sel: 'nav.tabs [data-v="dua"]' },
  { i: "🕋", k: 7, sel: 'nav.tabs [data-v="zy"]' },
  { i: "⚙️", k: 8, sel: "#remCard", v: "set" },
  { i: "🔔", k: 9, sel: "#azSetLink", v: "set" },
  { i: "✅", k: 10 }
];
let tourI = 0;
function tourPlace() {
  const st = TOUR[tourI], hole = $("tourHole"), box = $("tourBox"), el = st.sel && document.querySelector(st.sel), vw = innerWidth, vh = innerHeight;
  const bh = box.offsetHeight || 190, bw = box.offsetWidth || 320;
  if (!el) { hole.classList.add("none"); hole.style.left = vw / 2 + "px"; hole.style.top = vh / 2 + "px"; box.style.left = Math.max(12, (vw - bw) / 2) + "px"; box.style.top = Math.max(12, (vh - bh) / 2) + "px"; return; }
  const r = el.getBoundingClientRect(), pad = 6, top = Math.max(4, r.top - pad), h = Math.min(r.height + pad * 2, vh - top - 4);
  hole.classList.remove("none"); hole.style.left = Math.max(4, r.left - pad) + "px"; hole.style.top = top + "px"; hole.style.width = Math.min(r.width + pad * 2, vw - 8) + "px"; hole.style.height = h + "px";
  const below = vh - (top + h) > bh + 16, y = below ? top + h + 12 : Math.max(12, top - bh - 12);
  box.style.top = (r.height > vh * 0.6 ? Math.max(12, vh - bh - 90) : y) + "px";
  box.style.left = Math.min(Math.max(12, r.left + r.width / 2 - bw / 2), vw - bw - 12) + "px";
}
function tourShow() {
  const st = TOUR[tourI], last = tourI === TOUR.length - 1, box = $("tourBox");
  if (st.v && curView !== st.v) switchView(st.v);
  box.style.visibility = "hidden";
  const draw = () => {
    box.innerHTML = `<div class="ti">${st.i}</div><h4>${t("tr" + st.k + "T")}</h4><p>${t("tr" + st.k + "B")}</p><div class="tf"><div class="dots">${TOUR.map((_, n) => `<i class="${n === tourI ? "on" : ""}"></i>`).join("")}</div>` +
      `${last ? "" : `<button class="g" id="trSkip">${t("tourSkip")}</button>`}${tourI ? `<button class="g" id="trBack">${t("tourBack")}</button>` : ""}<button id="trNext">${last ? t("tourDone") : t("tourNext")}</button></div>`;
    $("trNext").onclick = () => last ? tourEnd() : (tourI++, tourShow()); if ($("trSkip")) $("trSkip").onclick = tourEnd; if ($("trBack")) $("trBack").onclick = () => { tourI--; tourShow(); };
    tourPlace(); box.style.visibility = "";
  };
  const el = st.sel && document.querySelector(st.sel);
  if (el && !el.closest("nav")) { const r = el.getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight - 80) window.scrollTo({ top: Math.max(0, window.scrollY + r.top - 90), behavior: "auto" }); }
  else if (!el) window.scrollTo(0, 0);
  setTimeout(draw, 80);
}
function tourStart() {
  if (window.tourOn) return; window.tourOn = true; tourI = 0;
  try { closeSheet && $("sheet").classList.remove("on"); } catch {}
  if (curView !== "cal") switchView("cal");
  window.scrollTo(0, 0); $("tour").classList.add("on"); document.documentElement.classList.add("tourlock"); tourShow();
}
function tourEnd() {
  store.set("tourSeen", Date.now()); window.tourOn = false; $("tour").classList.remove("on"); document.documentElement.classList.remove("tourlock");
  switchView("cal"); window.scrollTo(0, 0); window.dispatchEvent(new Event("tourdone"));
}
addEventListener("resize", () => { if (window.tourOn) tourPlace(); });
document.addEventListener("keydown", e => { if (!window.tourOn) return; if (e.key === "Escape") tourEnd(); else if (e.key === "ArrowRight" || e.key === "Enter") $("trNext").click(); else if (e.key === "ArrowLeft" && tourI) $("trBack").click(); });
$("tourBtn").onclick = e => { e.preventDefault(); tourStart(); };
(function autoTour(tries) {   // brand-new install only, once; waits for any open sheet
  if (store.get("tourSeen", 0)) return;
  setTimeout(() => { if (!isNewUser) return; if (wnOpen || $("sheet").classList.contains("on")) { if (tries < 20) autoTour(tries + 1); return; } tourStart(); }, tries ? 1500 : 1600);
})(0);
</script>
