<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hijri Calendar</title>
<meta name="description" content="Misri (Fatimi) Hijri calendar with miqaats for Dawoodi Bohras — works offline.">
<meta name="theme-color" content="#6b1824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hijri Cal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="themes.css?v=65">
<script src="theme-init.js?v=65"></script>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom));min-height:100vh}
.ar{font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif}
header.top{background:var(--hdr);color:var(--hdr-ink);padding:14px 0 0}
.top .hd{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 18px 12px;gap:10px}
.top .wdn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.top .big{font-size:44px;font-weight:600;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;margin:2px 0}
.top .big.ar{font-size:50px;font-weight:400;line-height:.9}
.top .hcol{text-align:right}
.top .hm{font-size:17px;line-height:1.2}
.top .my{font-size:13px;opacity:.8}
.top .hstrip{display:flex;justify-content:space-between;gap:8px;padding:7px 18px;font-size:11px;letter-spacing:.04em;background:var(--hdr-chip)}
.top .hstrip span:last-child{text-align:right;opacity:.85}
.top .hstrip{align-items:center}
.top .hstrip #tLoc{white-space:nowrap;flex:none}
.top .hstrip #tEve{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .hstrip #locBtn{flex:none}
#locBtn{border:1px solid var(--gold);background:none;color:var(--hdr-ink);font:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:4px 10px;white-space:nowrap}
.top .tstrip{display:flex;justify-content:space-between;padding:8px 18px;font-size:13px}
.top .tstrip span{opacity:.55}
.top .tstrip span b{font-weight:600;margin-left:4px}
.top .tstrip span.nx{opacity:1;font-weight:700}
.top .nextmq{padding:8px 18px 10px;font-size:13px;border-top:1px solid var(--hdr-chip);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .nextmq:empty{display:none}
.top .nextmq small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-right:6px}
main{max-width:640px;margin:0 auto;padding:12px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.monthbar button{background:var(--chip);border:0;color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:20px}
.monthbar .title{text-align:center;flex:1}
.monthbar .title b{display:block;font-size:17px}
.monthbar .title span{font-size:12px;color:var(--muted)}
.monthbar .title .ar{font-size:15px;color:var(--gold);display:block}
table.cal{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed}
.cal th{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.cal th.fri{color:var(--brand)}
.cal td{height:54px;vertical-align:middle;text-align:center;border-radius:12px;padding:0;position:relative;cursor:pointer;background:transparent}
.cal td.fri{background:color-mix(in srgb,var(--brand) 6%,transparent)}
.cal td.filler,.cal td.empty{background:transparent;cursor:default}
.cal td.filler>*{opacity:.35}
.cal td .h{font-size:20px;font-weight:600;line-height:1}
.cal td .h.ar{font-size:21px;font-weight:400}
.cal td .g{position:absolute;top:3px;right:5px;font-size:9px;color:var(--muted);line-height:1;white-space:nowrap}
.cal td .g b{font-weight:700;color:var(--brand)}
.cal td.mq1{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.cal td.mq1n{background:color-mix(in srgb,var(--night) 16%,transparent)}
.dot{position:absolute;left:0;right:0;bottom:4px;height:5px;display:flex;justify-content:center;gap:2px}
.dot i{width:5px;height:5px;border-radius:50%;background:var(--brand-2)}
.dot i.d{background:var(--gold)} .dot i.n{background:var(--night)}
.cal td.today{background:var(--today);color:var(--today-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--today) 40%,transparent)}
.cal td.today .g,.cal td.today .g b{color:var(--today-ink);opacity:.85}
.cal td.today .dot i{background:var(--today-ink)}
.cal td.filler.today{background:transparent;box-shadow:none;color:var(--brand)}
.cal td.filler.today .g{color:var(--muted)}
.cal td.sel:not(.today){outline:2px solid var(--brand);outline-offset:-2px}
.key{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.key .s{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:7px;position:relative;font-size:14px;font-weight:600;color:var(--ink);vertical-align:middle;margin-right:4px;border:1px solid var(--line)}
.key .s small{position:absolute;top:1px;right:2px;font-size:7px;color:var(--muted);font-weight:400}
.key .ksw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.mlist{margin-top:4px}
.mrow{display:flex;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer}
.mrow:first-child{border-top:0}
.mrow .dd{flex:0 0 46px;text-align:center;border-radius:10px;padding:4px 0;background:var(--chip)}
.mrow .dd b{display:block;font-size:17px;line-height:1.1}
.mrow .dd span{font-size:10px;color:var(--muted)}
.mrow.p1 .dd{background:color-mix(in srgb,var(--gold) 25%,transparent)}
.mrow.p1n .dd{background:color-mix(in srgb,var(--night) 18%,transparent)}
.mrow.past{opacity:.55}
.mrow .tt{flex:1;min-width:0;font-size:14px}
.mrow .tt div+div{margin-top:2px}
.mrow .tt .sub{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px;justify-content:center}
h3{margin:4px 0 8px;font-size:15px}
.mq{padding:8px 0;border-top:1px solid var(--line)}
.mq:first-of-type{border-top:0}
.mq .t{font-weight:600}
.mq .d{font-size:13px;color:var(--muted)}
.mq .when{font-size:12px;color:var(--brand);font-weight:600}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:middle}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.times div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.times small{display:block;color:var(--muted);font-size:11px}
.times b{font-size:16px}
.muted{color:var(--muted);font-size:12px}
.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
.btn.ghost{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.conv-out{font-size:18px;font-weight:700;margin-top:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 10px;font-size:11px}
nav.tabs button .i{display:block;font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--brand);font-weight:700}
.view{display:none}.view.on{display:block}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;z-index:10;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.instbar{display:flex;align-items:center;gap:8px;background:var(--gold);color:#1a1405;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px 14px;font-size:13px}
.instbar[hidden]{display:none}
.instbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instbar button{border:0;border-radius:999px;background:#1a1405;color:#fff;font:inherit;font-weight:700;font-size:12px;padding:6px 14px;white-space:nowrap}
.instbar button.x{background:none;color:#1a1405;font-size:20px;padding:0 6px;line-height:1}
.thumb{flex:none;width:44px;height:54px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f3ead8}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
#imgView{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 50px) 10px calc(env(safe-area-inset-bottom) + 20px)}
#imgView.on{display:block}
#imgView img{display:block;width:100%;max-width:600px;margin:0 auto;border-radius:10px}
#imgView button{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:40px;height:40px;border-radius:20px;border:0;font-size:22px;background:rgba(255,255,255,.9);color:#000}
.ashara{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:10px 14px}
.ashara .l{display:contents}
.ashara .t2{grid-row:1;grid-column:1;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ashara .t3{grid-row:2;grid-column:1;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ashara .cd{grid-row:1/3;grid-column:2;align-self:center;font-size:15px;font-weight:700;color:var(--on-brand);background:var(--brand);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ashara .cd small{font-size:11px;font-weight:600;opacity:.8;margin-left:1px}
.ashara .bar{grid-row:3;grid-column:1/-1;height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.ashara .bar i{display:block;height:100%;background:var(--gold)}
.upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:20;max-width:616px;margin:0 auto;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);transform:translateY(-150%);transition:transform .3s ease}
.upd.on{transform:none}
.upd .m{flex:1;font-size:14px;line-height:1.3}
.upd button{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;background:var(--on-brand);color:var(--brand)}
.upd .x{background:none;color:inherit;opacity:.8;padding:6px;font-size:18px}
.wn li{margin:6px 0}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
.install{display:none}
.banner{border-left:4px solid var(--gold);cursor:pointer}
.banner .when{font-size:12px;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.banner .t{font-weight:600;margin-top:2px}
a.btn{text-decoration:none;display:inline-block}
h4.plat{margin:14px 0 2px;font-size:14px}
.dua-item{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.dua-ic{width:46px;height:46px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:24px}
.dua-go{font-size:26px;color:var(--brand)}
.dua-item .muted{font-size:13px}
.ghnow{font-weight:600;margin:4px 0 8px;font-size:14px}
.gh{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;font-size:14px}
.gh:nth-child(odd){background:var(--bg)}
.gh .no{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.gh .tm{font-variant-numeric:tabular-nums}
.gh .pl{display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right}
.gh .pl i{width:10px;height:10px;border-radius:50%;flex:none}
.gh.cur{outline:2px solid var(--brand);background:var(--chip)!important;font-weight:700}
.lv-vgood{background:#1f9d55} .lv-good{background:#5bb974} .lv-normal{background:#d4a72c} .lv-unfav{background:#d14b4b}
#ghToggle button{font-size:12px;padding:6px 10px}
h3.sec{margin:16px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rz{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rz:first-child{border-top:0}
.rz .d{min-width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px}
.rz .d.ar{font-size:19px;font-weight:400}
.rz.today{background:var(--chip);border-radius:10px}
.rz.today .d{background:var(--brand);color:var(--on-brand)}
.rz .n{flex:1;font-weight:600}
.rz .go{color:var(--brand);font-size:20px}
.cal th{white-space:nowrap;overflow:hidden;text-overflow:clip}
.lang{display:flex;width:max-content;margin:0 0 8px auto;background:var(--hdr-chip);border-radius:9px;padding:2px}
.lang button,.langset button{border:0;background:none;color:inherit;font:inherit;font-size:12px;font-weight:600;padding:5px 8px;border-radius:7px;opacity:.8}
.lang button.on{background:#fff;color:var(--hdr-on);opacity:1}
.langset{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.langset button{font-size:14px;padding:8px 12px;color:var(--ink)}
.langset button.on{background:var(--brand);color:var(--on-brand);opacity:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;font:inherit;font-size:14px}
.sw.on{border-color:var(--brand);font-weight:700}
.sw i{width:22px;height:22px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="instbar" id="instBar" hidden><span>📲 <b data-i18n="instBar"></b></span><button id="instBtn" data-i18n="instBtn"></button><button class="x" id="instX" aria-label="Close">×</button></div>
<header class="top">
  <div class="hd">
    <div class="gcol"><div class="wdn" id="tWd"></div><div class="big" id="tGd"></div><div class="my" id="tGmy"></div></div>
    <div class="hcol"><div class="big ar" id="tHd"></div><div class="hm ar" dir="rtl" id="tHijriAr"></div><div class="my" id="tHijri"></div></div>
  </div>
  <div class="hstrip"><span id="tLoc"></span><button id="locBtn" hidden></button><span id="tEve"></span></div>
  <div class="tstrip" id="tStrip"></div>
  <div class="nextmq" id="tNext"></div>
</header>

<main>
  <!-- CALENDAR -->
  <section class="view on" id="v-cal">
    <div class="card banner" id="banner" style="display:none"></div>
    <div class="card ashara" id="ashara"></div>
    <div class="card">
      <div class="monthbar">
        <button id="prev" aria-label="Previous month">‹</button>
        <div class="title" id="mTitle"></div>
        <button id="next" aria-label="Next month">›</button>
      </div>
      <table class="cal" id="cal"></table>
      <div class="key" id="calKey"></div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" id="goToday" data-i18n="today"></button></div>
    </div>
    <div class="card" id="monthMq"></div>
    <div class="card" id="todayMq"></div>
    <div class="card">
      <h3><span data-i18n="timesH"></span> <span class="tag" id="locName"></span></h3>
      <div class="times" id="times"></div>
      <p class="muted" data-i18n="timesNote"></p>
    </div>
    <div class="card" id="ghadiCard">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h3 style="margin:0">⏳ <span data-i18n="ghH"></span> <span class="tag" id="ghLoc"></span></h3>
        <div class="langset" id="ghToggle"></div>
      </div>
      <div class="ghnow" id="ghNow"></div>
      <div id="ghList"></div>
      <p class="muted" style="font-size:11px" data-i18n="ghNote"></p>
    </div>
  </section>

  <!-- UPCOMING -->
  <section class="view" id="v-up">
    <div class="card">
      <h3 data-i18n="upH"></h3>
      <div class="row" style="margin-bottom:6px">
        <select id="upFilter">
          <option value="1" data-i18n="upMajor"></option>
          <option value="3" selected data-i18n="upAll"></option>
        </select>
        <select id="upRange">
          <option value="30" data-i18n="nDays" data-n="30"></option>
          <option value="90" selected data-i18n="nDays" data-n="90"></option>
          <option value="365" data-i18n="oneYear"></option>
        </select>
      </div>
      <div id="upList"></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="toRem" data-i18n="toRem"></button></div>
    </div>
  </section>

  <!-- DUA -->
  <section class="view" id="v-dua">
    <a class="card dua-item" href="ziyarat.html">
      <div class="dua-ic">🕌</div>
      <div style="flex:1"><b data-i18n="zH"></b><div class="muted" data-i18n="zDesc"></div></div>
      <div class="dua-go">›</div>
    </a>
    <h3 class="sec" data-i18n="secDuas"></h3>
    <a class="card dua-item" href="dua/">
      <div class="dua-ic">🤲</div>
      <div style="flex:1"><b data-i18n="duaKamil"></b><div class="muted" data-i18n="duaKamilDesc"></div></div>
      <div class="dua-go">›</div>
    </a>
    <a class="card dua-item" href="dua/?d=jawahir">
      <div class="dua-ic">💎</div>
      <div style="flex:1"><b data-i18n="jawahirH"></b><div class="muted" data-i18n="jawahirDesc"></div></div>
      <div class="dua-go">›</div>
    </a>
    <a class="card dua-item" href="dua/book.html?b=zikre">
      <div class="dua-ic">📕</div>
      <div style="flex:1"><b data-i18n="zikreH"></b><div class="muted" data-i18n="zikreDesc"></div></div>
      <div class="dua-go">›</div>
    </a>
    <a class="card dua-item" href="dua/book.html?b=azam">
      <div class="dua-ic">🕋</div>
      <div style="flex:1"><b data-i18n="azamH"></b><div class="muted" data-i18n="azamDesc"></div></div>
      <div class="dua-go">›</div>
    </a>
    <a class="card dua-item" href="dua/tasbeeh.html?m=week">
      <div class="dua-ic">📿</div>
      <div style="flex:1"><b data-i18n="weekH"></b><div class="muted" id="weekToday"></div></div>
      <div class="dua-go">›</div>
    </a>

    <h3 class="sec" data-i18n="secAmal"></h3>
    <div class="card">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <div style="flex:1"><b data-i18n="roziH"></b>
        <div class="muted" style="font-size:13px;margin:2px 0 8px" data-i18n="roziDesc"></div></div>
        <button class="thumb" data-img="dua/img/rozi-barakat-amal.jpg" aria-label="Chart"><img src="dua/img/rozi-barakat-amal.jpg" alt=""></button>
      </div>
      <div id="roziList"></div>
      <div class="muted" style="font-size:12px;margin-top:8px" data-i18n="roziExtra"></div>
    </div>

    <h3 class="sec" data-i18n="secQuran"></h3>
    <a class="card dua-item" href="dua/book.html?b=quran">
      <div class="dua-ic">📗</div>
      <div style="flex:1"><b data-i18n="qBookH"></b><div class="muted" data-i18n="qBookDesc"></div></div>
      <div class="dua-go">›</div>
    </a>
    <div id="quranList"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-set">
    <div class="card">

<script>
"use strict";

const ARD = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
const arNum = n => String(n).replace(/\d/g, c => ARD[c]);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- Language ---------- */
const LANGS = ["en", "gu", "hi"];
let lang = store.get("lang", "en");
if (!LANGS.includes(lang)) lang = "en";
let L = I18N[lang];
const t = (k, v = {}) => String(L[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");

function applyStatic() {
  document.documentElement.lang = lang === "gu" ? "gu" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n, { n: el.dataset.n }); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  const btns = cur => LANGS.map(k => `<button data-l="${k}" class="${k === cur ? "on" : ""}">${I18N[k]._label}</button>`).join("");
  $("langSet").innerHTML = btns(lang);
  $("numSet").innerHTML = [["en", "12"], ["ar", "١٢"]].map(([k, x]) => `<button data-num="${k}" class="${k === numStyle ? "on" : ""}">${x}</button>`).join("");
}
let numStyle = store.get("num", "ar");
const hNum = n => numStyle === "ar" ? arNum(n) : String(n);
document.addEventListener("click", e => { const b = e.target.closest("[data-num]"); if (b) { numStyle = b.dataset.num; store.set("num", numStyle); applyStatic(); renderCal(); } });
function setLang(k) {
  lang = k; L = I18N[k]; store.set("lang", k);
  applyStatic(); applyTheme(); renderAll();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) setLang(b.dataset.l); });

/* ---------- Theme ---------- */
const THEMES = { green: "#0f5132", maroon: "#7a1f2b", navy: "#1d3a6e", teal: "#0e6e6a", rose: "#f4b6ca", sky: "#a9d4f2", lavender: "#cbb9f0" };
const MODES = ["auto", "light", "dark"];
let theme = store.get("theme", "maroon"); if (!THEMES[theme]) theme = "maroon";
let mode = store.get("mode", "light"); if (!MODES.includes(mode)) mode = "light";
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const r = document.documentElement;
  r.setAttribute("data-theme", theme);
  r.classList.toggle("dark", mode === "dark" || (mode === "auto" && darkMQ.matches));
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(r).getPropertyValue("--hdr").trim();
  $("themeSet").innerHTML = Object.entries(THEMES).map(([k, c]) => `<button class="sw ${k === theme ? "on" : ""}" data-theme-k="${k}"><i style="background:${c}"></i>${t("th_" + k)}</button>`).join("");
  $("modeSet").innerHTML = MODES.map(k => `<button data-mode-k="${k}" class="${k === mode ? "on" : ""}">${t("md_" + k)}</button>`).join("");
}
darkMQ.addEventListener?.("change", applyTheme);
document.addEventListener("click", e => {
  const a = e.target.closest("[data-theme-k]"); if (a) { theme = a.dataset.themeK; store.set("theme", theme); applyTheme(); }
  const b = e.target.closest("[data-mode-k]"); if (b) { mode = b.dataset.modeK; store.set("mode", mode); applyTheme(); }
});

/* ---------- Miqaats ---------- */
let MIQ = [];
const miqaatsFor = (y, m, d) => {
  const e = MIQ.find(x => x.month === m && x.date === d);
  return e ? e.miqaats.filter(q => !q.year || q.year <= y).sort((a, b) => a.priority - b.priority) : [];
};

/* ---------- Sun times (NOAA) ---------- */
function sunTimes(Y, M, D, lat, lng) {
  const rad = Math.PI / 180;
  const jd = H.gToAJD(Y, M, D) + 0.5 - lng / 360; // ~local noon
  const T = (jd - 2451545) / 36525;
  const L0 = (280.46646 + T * (36000.76983 + 0.0003032 * T)) % 360;
  const Ma = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const C = Math.sin(Ma * rad) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * Ma * rad) * (0.019993 - 0.000101 * T) + Math.sin(3 * Ma * rad) * 0.000289;
  const lam = L0 + C - 0.00569 - 0.00478 * Math.sin((125.04 - 1934.136 * T) * rad);
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos((125.04 - 1934.136 * T) * rad);
  const decl = Math.asin(Math.sin(eps * rad) * Math.sin(lam * rad));
  const yv = Math.tan(eps / 2 * rad) ** 2;
  const eqt = 4 / rad * (yv * Math.sin(2 * L0 * rad) - 2 * e * Math.sin(Ma * rad) + 4 * e * yv * Math.sin(Ma * rad) * Math.cos(2 * L0 * rad) - 0.5 * yv * yv * Math.sin(4 * L0 * rad) - 1.25 * e * e * Math.sin(2 * Ma * rad));
  const noon = 720 - 4 * lng - eqt; // minutes UTC
  const cosH = (Math.cos(90.833 * rad) - Math.sin(lat * rad) * Math.sin(decl)) / (Math.cos(lat * rad) * Math.cos(decl));
  const ha = Math.acos(Math.max(-1, Math.min(1, cosH))) / rad;
  const at = min => new Date(Date.UTC(Y, M, D) + min * 6e4);
  return { sunrise: at(noon - 4 * ha), noon: at(noon), sunset: at(noon + 4 * ha) };
}
const fmtT = d => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

/* ---------- State ---------- */
const DEFAULT_LOC = { lat: 22.7196, lng: 75.8577, key: "indore" };
// key: "auto" = follow the phone's location (re-detected on every open), "indore", or "custom" lat/lng
let loc = store.get("loc", { ...DEFAULT_LOC, key: "auto" });
if (!loc.key) loc.key = { "Indore": "indore", "Meri location": "gps" }[loc.name] || "custom"; // migrate v1
if (!store.get("locV2", false)) { if (loc.key !== "custom") loc = { ...loc, key: "auto" }; store.set("locV2", true); store.set("loc", loc); } // v48: auto by default
const locLabel = () => loc.key === "auto" ? (loc.city || (loc.lat === DEFAULT_LOC.lat && loc.lng === DEFAULT_LOC.lng ? t("locIndore") : t("locGps"))) : t({ indore: "locIndore", gps: "locGps" }[loc.key] || "locCustom");
const now = new Date();
const todayAJD = H.gToAJD(now.getFullYear(), now.getMonth(), now.getDate());
const todayH = H.fromAJD(todayAJD);
let view = { y: todayH.y, m: todayH.m };
let selAJD = null;

const hStr = h => `${h.d} ${L.hijriMonths[h.m]} ${h.y}${L.hSuffix}`;
const hShort = h => `${h.d} ${L.hijriShort[h.m]}`;
const hStrAr = h => `${arNum(h.d)} ${H.AR[h.m]} ${arNum(h.y)}هـ`;
const gStr = g => `${g.d} ${L.gMonths[g.m]} ${g.y}`;
const wd = a => L.wd[H.dow(a)];

/* ---------- Header ---------- */
function renderHeader() {
  const g = H.ajdToG(todayAJD), n = new Date();
  $("tWd").textContent = wd(todayAJD);
  $("tGd").textContent = String(g.d).padStart(2, "0");
  $("tGmy").textContent = `${L.gShort[g.m]} ${g.y}`;
  $("tHd").textContent = hNum(todayH.d);
  $("tHijriAr").textContent = `${H.AR[todayH.m]} ${arNum(todayH.y)}هـ`;
  $("tHijri").textContent = `${L.hijriMonths[todayH.m]} ${todayH.y}${L.hSuffix}`;
  const s = sunTimes(n.getFullYear(), n.getMonth(), n.getDate(), loc.lat, loc.lng);
  $("tLoc").textContent = "📍 " + locLabel();
  const denied = loc.key === "auto" && store.get("locDenied", false);
  $("locBtn").hidden = !denied; $("locBtn").textContent = t("locOn");
  $("tEve").textContent = n > s.sunset ? "🌙 " + t("eveNight", { d: hShort(H.fromAJD(todayAJD + 1)) }) : "";
  const tl = [["tSunrise", s.sunrise], ["tZawaal", s.noon], ["tMaghrib", s.sunset]];
  const nx = tl.findIndex(x => x[1] > n);
  $("tStrip").innerHTML = tl.map(([k, d], i) => `<span class="${i === nx ? "nx" : ""}">${t(k)}<b>${fmtT(d)}</b></span>`).join("");
  // next miqaat (today's night or later)
  let nm = "";
  for (let k = 0; k < 60 && !nm; k++) {
    const a = todayAJD + k, h = H.fromAJD(a);
    const q = miqaatsFor(h.y, h.m, h.d).filter(q => q.priority <= 2 && (k > 0 || (q.phase === "night" && n < s.sunset)))[0];
    if (q) nm = `<span data-a="${a}"><small>${t("nextMq")}</small>${esc(q.title)} · ${hShort(h)}${k === 0 ? "" : " · " + (k === 1 ? t("relTomorrow") : wd(a))}</span>`;
  }
  $("tNext").innerHTML = nm;
}

/* ---------- Calendar grid ---------- */
function renderCal() {
  const { y, m } = view;
  const first = H.toAJD(y, m, 1), n = H.daysInMonth(y, m);
  const lead = H.dow(first);
  const cells = [];
  for (let i = lead; i > 0; i--) cells.push({ ajd: first - i, filler: true });
  for (let i = 0; i < n; i++) cells.push({ ajd: first + i });
  while (cells.length % 7) cells.push({ ajd: first + n + (cells.length - lead - n), filler: true });

  const g1 = H.ajdToG(first), g2 = H.ajdToG(first + n - 1);
  $("mTitle").innerHTML = `<b>${L.hijriMonths[m]} ${y}${L.hSuffix}</b><span class="ar" dir="rtl">${H.AR[m]} ${arNum(y)}</span>
    <span>${L.gShort[g1.m]} ${g1.y === g2.y ? "" : g1.y + " "}– ${L.gShort[g2.m]} ${g2.y}${H.isKabisa(y) ? " · " + t("leap") : ""}</span>`;

  let html = "<thead><tr>" + L.wdShort.map((d, i) => `<th class="${i === 5 ? "fri" : ""}">${d}</th>`).join("") + "</tr></thead><tbody>";
  cells.forEach((c, i) => {
    if (i % 7 === 0) html += "<tr>";
    const h = H.fromAJD(c.ajd), g = H.ajdToG(c.ajd);
    const gl = (h.d === 1 || g.d === 1) && !c.filler ? `<b>${L.gShort[g.m]}</b> ${g.d}` : String(g.d);
    let cls = c.filler ? "filler" : "";
    if (i % 7 === 5) cls += " fri";
    if (c.ajd === todayAJD) cls += " today";
    if (c.ajd === selAJD) cls += " sel";
    let dot = "";
    if (!c.filler) {
      const qs = miqaatsFor(h.y, h.m, h.d);
      const top = qs[0];
      if (top && top.priority === 1) cls += top.phase === "night" ? " mq1n" : " mq1";
      if (qs.length) dot = `<span class="dot">${qs.slice(0, 3).map(q => `<i class="${q.priority === 1 ? (q.phase === "night" ? "n" : "d") : ""}"></i>`).join("")}</span>`;
    }
    html += `<td class="${cls}" data-a="${c.ajd}"><span class="g">${gl}</span><div class="h${numStyle === "ar" ? " ar" : ""}">${hNum(h.d)}</div>${dot}</td>`;
    if (i % 7 === 6) html += "</tr>";
  });
  $("cal").innerHTML = html + "</tbody>";
  $("calKey").innerHTML = `<span><span class="s">${hNum(12)}<small>3</small></span>${t("keyNums")}</span>
    <span><span class="ksw" style="background:color-mix(in srgb,var(--gold) 35%,transparent)"></span>${t("legendDay")}</span>
    <span><span class="ksw" style="background:color-mix(in srgb,var(--night) 28%,transparent)"></span>${t("legendNight")}</span>
    <span><span class="ksw" style="width:6px;height:6px;border-radius:50%;background:var(--brand-2);vertical-align:1px"></span>${t("legendOther")}</span>`;
  renderMonthMq();
}

function renderMonthMq() {
  const { y, m } = view, first = H.toAJD(y, m, 1);
  let rows = "";
  for (let d = 1; d <= H.daysInMonth(y, m); d++) {
    const qs = miqaatsFor(y, m, d); if (!qs.length) continue;
    const a = first + d - 1, g = H.ajdToG(a), top = qs[0];
    const cls = (top.priority === 1 ? (top.phase === "night" ? "p1n" : "p1") : "") + (a < todayAJD ? " past" : "");
    rows += `<div class="mrow ${cls}" data-a="${a}"><div class="dd"><b>${hNum(d)}</b><span>${g.d} ${L.gShort[g.m]}</span></div>
      <div class="tt">${qs.map(q => `<div>${icon(q)}${esc(q.title)}${nightTag(q)}</div>`).join("")}<div class="sub">${wd(a)}</div></div></div>`;
  }
  $("monthMq").innerHTML = `<h3>${t("monthMq", { m: L.hijriMonths[m] })}</h3><div class="mlist">${rows || `<p class="muted">${t("noMq")}</p>`}</div>`;
}

const icon = q => q.priority === 1 ? (q.phase === "night" ? "☾ " : "☀ ") : "";
const nightTag = q => q.phase === "night" ? `<span class="tag">${t("nightTag")}</span>` : "";
function mqHTML(list) {
  if (!list.length) return `<p class="muted">${t("noMq")}</p>`;
  return list.map(q => `<div class="mq"><div class="t">${icon(q)}${esc(q.title)}${nightTag(q)}</div>${q.description ? `<div class="d">${esc(q.description)}</div>` : ""}</div>`).join("");
}

function renderTodayMq() {
  $("todayMq").innerHTML = `<h3>${t("todayMq")}</h3>${mqHTML(miqaatsFor(todayH.y, todayH.m, todayH.d))}`;
}

function renderTimes() {
  const s = sunTimes(now.getFullYear(), now.getMonth(), now.getDate(), loc.lat, loc.lng);
  const t2 = new Date(now); t2.setDate(t2.getDate() + 1);
  const s2 = sunTimes(t2.getFullYear(), t2.getMonth(), t2.getDate(), loc.lat, loc.lng);
  const nisf = new Date((s.sunset.getTime() + s2.sunrise.getTime()) / 2);
  const fajr = new Date(s.sunrise.getTime() - 60 * 6e4);
  const items = [["tFajr", fajr], ["tSunrise", s.sunrise], ["tZawaal", s.noon], ["tMaghrib", s.sunset], ["tNisf", nisf]];
  $("times").innerHTML = items.map(([k, v]) => `<div><small>${t(k)}</small><b>${fmtT(v)}</b></div>`).join("");
  $("locName").textContent = locLabel();
  $("locCur").textContent = t("locNow", { name: locLabel(), lat: loc.lat.toFixed(4), lng: loc.lng.toFixed(4) });
}

/* ---------- Ghadi (planetary hours, as on aajnodin.com / Busaheba Sahifa) ---------- */
// Chaldean order; first day-ghadi of each weekday: Sun=Shams, Mon=Qamar, Tue=Mirrikh, Wed=Atarad, Thu=Mushtari, Fri=Zahrat, Sat=Zuhal
const GH_LV = ["good", "vgood", "normal", "good", "unfav", "vgood", "unfav"];
const GH_FIRST = [0, 3, 6, 2, 5, 1, 4];
let ghMode = null; // "day" | "night"; null = follow the clock
function ghadiOf(d0, night) {  // d0 = local date of the day whose day/night we want
  const s = sunTimes(d0.getFullYear(), d0.getMonth(), d0.getDate(), loc.lat, loc.lng);
  const n = new Date(d0); n.setDate(n.getDate() + 1);
  const s2 = sunTimes(n.getFullYear(), n.getMonth(), n.getDate(), loc.lat, loc.lng);
  const a = night ? s.sunset : s.sunrise, b = night ? s2.sunrise : s.sunset, len = (b - a) / 12;
  const first = GH_FIRST[d0.getDay()] + (night ? 12 : 0);
  return Array.from({ length: 12 }, (_, k) => ({ k: k + 1, from: new Date(+a + len * k), to: new Date(+a + len * (k + 1)), p: (first + k) % 7 }));
}
function renderGhadi() {
  const nowD = new Date(), today = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate());
  const st = sunTimes(today.getFullYear(), today.getMonth(), today.getDate(), loc.lat, loc.lng);
  // which day/night are we in right now?
  let curBase = today, curNight = false;
  if (nowD >= st.sunset) curNight = true;
  else if (nowD < st.sunrise) { curBase = new Date(today); curBase.setDate(curBase.getDate() - 1); curNight = true; }
  const night = ghMode ? ghMode === "night" : curNight;
  const base = night === curNight ? curBase : today;
  const list = ghadiOf(base, night);
  const cur = ghadiOf(curBase, curNight).find(g => nowD >= g.from && nowD < g.to);
  $("ghToggle").innerHTML = ["day", "night"].map(m => `<button data-gh="${m}" class="${(night ? "night" : "day") === m ? "on" : ""}">${t(m === "day" ? "ghDay" : "ghNight")}</button>`).join("");
  $("ghNow").innerHTML = cur ? `<span class="pl"><i class="lv-${GH_LV[cur.p]}" style="display:inline-block;width:10px;height:10px;border-radius:50%"></i></span> ` + t("ghNow", { p: L.ghP[cur.p], l: L.ghL[GH_LV[cur.p]], t: fmtT(cur.to) }) : "";
  $("ghList").innerHTML = list.map(g => `<div class="gh ${cur && +g.from === +cur.from ? "cur" : ""}"><span class="no">${g.k}</span><span class="tm">${fmtT(g.from)} – ${fmtT(g.to)}</span><span class="pl">${L.ghP[g.p]} · ${L.ghL[GH_LV[g.p]]}<i class="lv-${GH_LV[g.p]}"></i></span></div>`).join("");
  $("ghLoc").textContent = `${L.wd[base.getDay()]} · ${locLabel()}`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-gh]"); if (b) { ghMode = b.dataset.gh; renderGhadi(); } });
setInterval(() => { if (document.visibilityState === "visible") renderGhadi(); }, 60000);

/* ---------- Day sheet ---------- */
function openDay(ajd) {
  selAJD = ajd; renderCal();
  const h = H.fromAJD(ajd), g = H.ajdToG(ajd);
  const s = sunTimes(g.y, g.m, g.d, loc.lat, loc.lng);
  $("sheetBody").innerHTML = `<div style="font-size:20px;font-weight:700">${hStr(h)}</div>
    <div class="ar" dir="rtl" style="font-size:18px;color:var(--gold)">${hStrAr(h)}</div>
    <div class="muted" style="font-size:14px;margin:2px 0 10px">${wd(ajd)}, ${gStr(g)} · ${t("tMaghrib")} ${fmtT(s.sunset)}</div>
    <h3>${t("miqaats")}</h3>${mqHTML(miqaatsFor(h.y, h.m, h.d))}`;
  $("sheetBg").style.display = "block";
  requestAnimationFrame(() => $("sheet").classList.add("on"));
}
function closeSheet() { $("sheet").classList.remove("on"); $("sheetBg").style.display = "none"; selAJD = null; renderCal(); }

/* ---------- Reminder banner (next 3 days, badi miqaats) ---------- */
function renderBanner() {
  const items = [];
  for (let k = 0; k <= 3 && items.length < 3; k++) {
    const a = todayAJD + k, h = H.fromAJD(a);
    const qs = miqaatsFor(h.y, h.m, h.d).filter(q => q.priority <= 2);
    const night = qs.filter(q => q.phase === "night"), day = qs.filter(q => q.phase === "day");
    // day miqaat k days away; night miqaat = evening of that day
    if (k > 0 && day.length) items.push({ a, when: k === 1 ? t("relTomorrow") : t("bInDays", { n: k, wd: wd(a) }), qs: day });
    if (night.length) items.push({ a, when: k === 0 ? t("bTonight") : k === 1 ? t("bTomorrowNight") : t("bWdNight", { wd: wd(a) }), qs: night });
  }
  if (H.dow(todayAJD) === 4) items.unshift({ a: null, when: t("bTonight"), dua: "dua/", txt: t("bDuaKamil"), ic: "🤲" });
  const rz = ROZI.find(r => r[0] === todayH.d);
  if (rz) items.unshift({ a: null, when: t("relToday"), dua: `dua/quran.html?s=${rz[1]}`, txt: t("bRozi", { s: surahName(rz[1]) }), ic: "📖" });
  if (H.dow(todayAJD) === 5) items.unshift({ a: null, when: t("relToday"), dua: "dua/quran.html?s=18", txt: t("bKahf"), ic: "📖" });
  const b = $("banner");
  if (!items.length) { b.style.display = "none"; return; }
  b.style.display = "";
  b.innerHTML = items.map(i => i.dua ? `<div class="mq" data-dua="${i.dua}"><div class="when">${i.ic} ${i.when}</div><div class="t">${i.txt}</div></div>` : `<div class="mq" data-a="${i.a}"><div class="when">🔔 ${i.when}</div>${i.qs.map(q => `<div class="t">${q.phase === "night" ? "☾ " : "☀ "}${esc(q.title)}</div>`).join("")}</div>`).join("");
}
$("banner").onclick = e => { const d = e.target.closest("[data-dua]"); if (d) { location.href = d.dataset.dua; return; } const r = e.target.closest("[data-a]"); if (r) { const a = +r.dataset.a, h = H.fromAJD(a); view = { y: h.y, m: h.m }; renderCal(); openDay(a); } };

function setupSubscribe() {
  const base = location.host + location.pathname.replace(/[^/]*$/, "") + "calendar/";
  $("subMajor").href = "webcal://" + base + "miqaats-major.ics";
  $("subAll").href = "webcal://" + base + "miqaats-all.ics";
  $("subUrl").textContent = "webcal://" + base + "miqaats-major.ics";
  $("subHttps").innerHTML = `${location.protocol}//${base}miqaats-major.ics<br>${location.protocol}//${base}amal.ics`;
  $("subAmal").href = "webcal://" + base + "amal.ics";
}

/* ---------- Dua tab: Quran list, Rozi amal, weekly tasbih ---------- */
const SURAHS = [[36, "يٰسٓ", "Yaseen"], [18, "📖", "al-Kahf"], [55, "📖", "ar-Rahman"], [56, "📖", "al-Waqiah"], [59, "📖", "al-Hashr"], [62, "📖", "al-Jumuah"], [72, "📖", "al-Jinn"]];
const ROZI = [[2, 36, "Yaseen"], [3, 55, "ar-Rahman"], [4, 56, "al-Waqiah"], [5, 59, "al-Hashr"], [6, 62, "al-Jumuah"], [7, 72, "al-Jinn"]];
const WEEK_TASBIH = ["Iyyaka Na'budu Wa Iyyaka Nasta'een", "Ya Ghafoor, Ya Raheem", "SubhanAllahi wal Hamdu Lillah", "Ya Rahman, Ya Raheem", "HasbunAllahu Wa Ni'mal Wakeel", "Ya Zal Jalali Wal Ikram", "Ya Hayyu, Ya Qayyum"];
const surahName = n => `${t("surahPrefix")} ${(SURAHS.find(x => x[0] === n) || [0, 0, n])[2]}`;
function renderDuaTab() {
  $("quranList").innerHTML = SURAHS.filter(x => x[0] === 18).map(([n, ic]) => `<a class="card dua-item" href="dua/quran.html?s=${n}"><div class="dua-ic ar">${ic}</div><div style="flex:1"><b>${surahName(n)}</b><div class="muted">${t("sDesc")}</div></div><div class="dua-go">›</div></a>`).join("");
  $("roziList").innerHTML = ROZI.map(([d, n]) => `<a class="rz ${todayH.d === d ? "today" : ""}" href="dua/quran.html?s=${n}"><span class="d ar">${arNum(d)}</span><span class="n">${surahName(n)}</span>${todayH.d === d ? `<span class="tag">${t("today")}</span>` : ""}<span class="go">›</span></a>`).join("");
  $("weekToday").textContent = `${t("tToday")}: ${WEEK_TASBIH[H.dow(todayAJD)]} · 100×`;
}

/* ---------- Upcoming ---------- */
function renderUpcoming() {
  const maxP = +$("upFilter").value, days = +$("upRange").value;
  let html = "";
  for (let a = todayAJD; a < todayAJD + days; a++) {
    const h = H.fromAJD(a);
    const list = miqaatsFor(h.y, h.m, h.d).filter(q => q.priority <= maxP);
    if (!list.length) continue;
    const g = H.ajdToG(a), diff = a - todayAJD;
    const rel = diff === 0 ? t("relToday") : diff === 1 ? t("relTomorrow") : t("relIn", { n: diff });
    html += `<div class="mq" data-a="${a}"><div class="when">${hShort(h)} · ${L.wdShort[H.dow(a)]}, ${g.d} ${L.gShort[g.m]} ${g.y} · ${rel}</div>${list.map(q => `<div class="t">${icon(q)}${esc(q.title)}${nightTag(q)}</div>`).join("")}</div>`;
  }
  $("upList").innerHTML = html || `<p class="muted">${t("upNone")}</p>`;
}

/* ---------- Converter ---------- */
function gConvert() {
  const [Y, M, D] = $("gIn").value.split("-").map(Number);
  if (!Y) return;
  const h = H.fromAJD(H.gToAJD(Y, M - 1, D));
  $("gOut").textContent = hStr(h);
  $("gOutAr").textContent = hStrAr(h);
}
function hConvert() {
  const d = +$("hD").value, m = +$("hM").value, y = +$("hY").value;
  if (!y || !d) return;
  const max = H.daysInMonth(y, m);
  if (d < 1 || d > max) { $("hOut").textContent = t("onlyDays", { m: L.hijriMonths[m], y, n: max }); $("hShow").style.display = "none"; return; }
  const a = H.toAJD(y, m, d), g = H.ajdToG(a);
  $("hOut").textContent = `${wd(a)}, ${gStr(g)}`;
  $("hShow").style.display = "";
  $("hShow").onclick = () => { view = { y, m }; switchView("cal"); renderCal(); openDay(a); };
}
function renderMonthSelect() {
  const v = $("hM").value || todayH.m;
  $("hM").innerHTML = L.hijriMonths.map((n, i) => `<option value="${i}">${n}</option>`).join("");
  $("hM").value = v;
}
function setupConv() {
  renderMonthSelect();
  const g = H.ajdToG(todayAJD);
  $("gIn").value = `${g.y}-${String(g.m + 1).padStart(2, "0")}-${String(g.d).padStart(2, "0")}`;
  $("hD").value = todayH.d; $("hM").value = todayH.m; $("hY").value = todayH.y;
  $("gGo").onclick = gConvert;
  $("hGo").onclick = hConvert;
}

/* ---------- Navigation ---------- */
let curView = "cal";
function shiftMonth(k) {
  let { y, m } = view; m += k;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  view = { y, m }; selAJD = null; renderCal();
}
function switchView(v) {
  curView = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (v === "up") renderUpcoming();
  window.scrollTo(0, 0);
}
$("prev").onclick = () => shiftMonth(-1);
$("next").onclick = () => shiftMonth(1);
$("goToday").onclick = () => { view = { y: todayH.y, m: todayH.m }; selAJD = null; renderCal(); };
$("cal").onclick = e => { const td = e.target.closest("td[data-a]"); if (td && !td.classList.contains("filler")) openDay(+td.dataset.a); };
$("upList").onclick = e => { const r = e.target.closest("[data-a]"); if (r) { const a = +r.dataset.a, h = H.fromAJD(a); view = { y: h.y, m: h.m }; switchView("cal"); openDay(a); } };
$("sheetBg").onclick = closeSheet;
$("monthMq").onclick = e => { const r = e.target.closest("[data-a]"); if (r) openDay(+r.dataset.a); };
$("toRem").onclick = () => switchView("set");
$("upFilter").onchange = $("upRange").onchange = renderUpcoming;
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => switchView(b.dataset.v));

// swipe months
let sx = null, sy = null;
const calEl = $("cal");
calEl.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
calEl.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx < 0 ? 1 : -1);
  sx = null;
}, { passive: true });

/* ---------- Location ---------- */
function setLoc(l) { loc = l; store.set("loc", l); renderTimes(); renderHeader(); renderGhadi(); renderAshara(); }
$("useIndore").onclick = () => setLoc(DEFAULT_LOC);
$("saveLL").onclick = () => {
  const lat = parseFloat($("lat").value), lng = parseFloat($("lng").value);
  if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) setLoc({ lat, lng, key: "custom" });
};
// Auto location: ask the phone for its position on open/resume (at most every 30 min); keep the
// last known place (or Indore) if it fails. City name via BigDataCloud's free client-side reverse geocoder.
let lastDetect = 0;
function detectLoc(manual) {
  if (!navigator.geolocation) { if (manual) alert(t("geoNA")); return; }
  if (!manual && (loc.key !== "auto" || Date.now() - lastDetect < 30 * 60000)) return;
  lastDetect = Date.now();
  navigator.geolocation.getCurrentPosition(p => {
    const lat = +p.coords.latitude.toFixed(4), lng = +p.coords.longitude.toFixed(4);
    const moved = Math.abs(lat - loc.lat) > 0.02 || Math.abs(lng - loc.lng) > 0.02;
    const keepCity = !moved && loc.key === "auto" && loc.city;
    setLoc({ lat, lng, key: "auto", city: keepCity ? loc.city : "" });
    if (!keepCity) fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
      .then(r => r.json()).then(j => { const c = j.city || j.locality || j.principalSubdivision; if (c && loc.key === "auto") setLoc({ ...loc, city: c }); }).catch(() => {});
    store.set("locDenied", false); renderHeader();
  }, err => {
    if (err.code === 1) { store.set("locDenied", true); renderHeader(); if (manual) alert(t("geoHelp")); }
    else if (manual) alert(t("geoErr") + err.message);
  }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60000 });
}
$("useGps").onclick = $("locBtn").onclick = () => { loc = { ...loc, key: "auto" }; detectLoc(true); };
detectLoc();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") detectLoc(); });

/* ---------- Boot ---------- */
let miqLoaded = false;
function renderAll() {
  renderHeader(); renderAshara(); renderCal(); renderTimes(); renderMonthSelect(); gConvert(); hConvert();
  renderDuaTab(); renderGhadi();
  if (miqLoaded) { renderTodayMq(); renderBanner(); }
  if (curView === "up") renderUpcoming();
  if ($("sheet").classList.contains("on") && selAJD !== null) openDay(selAJD);
}
const APP_V = 65, APP_VERSION = APP_V + " (2026-11-09)";
$("appVer").textContent = APP_VERSION;
applyStatic(); applyTheme(); setupConv(); setupSubscribe(); renderAll();
if (location.hash === "#dua") switchView("dua");
fetch("miqaats.json").then(r => r.json()).then(d => { MIQ = d; miqLoaded = true; renderAll(); }).catch(() => { $("todayMq").innerHTML = `<p class="muted">${t("loadFail")}</p>`; });
// refresh "today" when app resumes on a new day
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { const n = new Date(); if (n.getDate() !== now.getDate()) location.reload(); else renderHeader(); }
});
if ("serviceWorker" in navigator) {
  // updateViaCache:none + update() on every resume = new versions arrive fast; reload once when a new worker takes over
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") r.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
}
document.addEventListener("click", e => { const b = e.target.closest("[data-img]"); if (b) { $("imgView").querySelector("img").src = b.dataset.img; $("imgView").classList.add("on"); } });
$("imgView").onclick = e => { if (e.target.tagName !== "IMG") $("imgView").classList.remove("on"); };

/* ---------- Ashara Mubaraka countdown ---------- */
// Ashara = 1–10 Muharram. A Misri day begins at the previous Maghrib, so 1 Muharram starts at
// sunset on the Gregorian eve. Before it: live countdown; during 1–10: "day n of 10"; then next year.
function asharaStart(y) {
  const g = H.ajdToG(H.toAJD(y, 0, 1) - 1);
  return { y, a: H.toAJD(y, 0, 1), at: sunTimes(g.y, g.m, g.d, loc.lat, loc.lng).sunset };
}
function renderAshara() {
  const nowT = new Date(), cur = H.fromAJD(todayAJD);
  const s = sunTimes(nowT.getFullYear(), nowT.getMonth(), nowT.getDate(), loc.lat, loc.lng);
  const hNow = H.fromAJD(todayAJD + (nowT > s.sunset ? 1 : 0)); // after Maghrib = next Hijri day
  const el = $("ashara");
  if (hNow.m === 0 && hNow.d <= 10) {
    const n = hNow.d;
    el.innerHTML = `<div class="l"><div class="t2">🕌 ${t("ashName")} ${hNow.y}${L.hSuffix}</div><div class="t3">${n === 10 ? t("ashAshura") : t("ashLeft", { n: 10 - n })}</div><div class="bar"><i style="width:${n * 10}%"></i></div></div><div class="cd">${n}<small>/10</small></div>`;
    return;
  }
  let st = asharaStart(cur.m === 0 ? cur.y + 1 : cur.y + 1);
  if (cur.m === 0 && cur.d > 10) st = asharaStart(cur.y + 1);
  if (st.at <= nowT) st = asharaStart(st.y + 1);
  const sec = Math.floor((st.at - nowT) / 1000), p2 = v => String(v).padStart(2, "0");
  const D = Math.floor(sec / 86400), Hh = Math.floor(sec % 86400 / 3600), M = Math.floor(sec % 3600 / 60), S = sec % 60;
  const g = H.ajdToG(st.a - 1);
  el.innerHTML = `<div class="l"><div class="t2">🕌 ${t("ashName")} ${st.y}${L.hSuffix}</div><div class="t3">${g.d} ${L.gShort[g.m]} ${g.y} · ${fmtT(st.at)}</div></div>
    <div class="cd">${D}<small>${t("ashDs")}</small> ${p2(Hh)}:${p2(M)}:${p2(S)}</div>`;
}
setInterval(() => { if (document.visibilityState === "visible" && curView === "cal") renderAshara(); }, 1000);
setInterval(() => { if (document.visibilityState === "visible") renderHeader(); }, 60000);
$("tNext").onclick = e => { const r = e.target.closest("[data-a]"); if (r) { const a = +r.dataset.a, h = H.fromAJD(a); view = { y: h.y, m: h.m }; switchView("cal"); renderCal(); openDay(a); } };

/* ---------- "Install app" button (mobile browser only) ---------- */
// Hidden when already installed (standalone), on desktop, or after the user closed it (shown again after 7 days).
let deferredInstall = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /android|mobile/i.test(navigator.userAgent);
function updInstBar() {
  const hideUntil = store.get("instHide", 0);
  $("instBar").hidden = isStandalone() || !isMobile || Date.now() < hideUntil;
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener("appinstalled", () => { deferredInstall = null; $("instBar").hidden = true; });
$("instX").onclick = () => { store.set("instHide", Date.now() + 7 * 864e5); updInstBar(); };
$("instBtn").onclick = async () => {
  if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; updInstBar(); return; }
  // iPhone (or a browser without the prompt): show the steps
  $("sheetBody").innerHTML = `<div style="font-size:20px;font-weight:700">📲 ${t("installH")}</div>
    <h4 class="plat">${t(isIOS ? "platIphone" : "platAndroid")}</h4>
    <ol class="muted" style="font-size:14px;padding-left:18px;margin:0">${t(isIOS ? "installSteps" : "installAndroidSteps")}</ol>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="instOk">${t("updOk")}</button></div>`;
  $("sheetBg").style.display = "block"; requestAnimationFrame(() => $("sheet").classList.add("on"));
  $("instOk").onclick = closeSheet;
};
updInstBar();

/* ---------- Update notification ---------- */
// version.json is bumped with every deploy. If the server has a newer one than this code, show an
// "update available" bar; after the update loads, show "what's new" once (versions newer than last seen).
const notesOf = e => e[lang] || e.en || [];
function showWhatsNew(list) {
  $("sheetBody").innerHTML = `<div style="font-size:20px;font-weight:700">🎉 ${t("updDone", { v: APP_V })}</div>` +
    list.map(e => `<h3 style="margin-top:12px">v${e.v} <span class="tag">${esc(e.date)}</span></h3><ul class="wn">${notesOf(e).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("") +
    `<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="wnOk">${t("updOk")}</button></div>`;
  $("sheetBg").style.display = "block";
  requestAnimationFrame(() => $("sheet").classList.add("on"));
  $("wnOk").onclick = closeSheet;
}
function updBar(html) { $("upd").innerHTML = html; $("upd").classList.add("on"); }
$("upd").onclick = e => {
  if (e.target.closest(".x")) { $("upd").classList.remove("on"); return; }
  if (e.target.closest("[data-upd]")) {
    e.target.textContent = "…";
    const go = () => location.reload();
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r ? r.update().then(go, go) : go(), go); else go();
  }
};
let verInfo = null;
function checkUpdate() {
  fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(j => {
    verInfo = j;
    if (j.v > APP_V) updBar(`<span style="font-size:22px">🔔</span><div class="m"><b>${t("updNew", { v: j.v })}</b><br>${esc(notesOf(j.history.find(e => e.v === j.v) || {})[0] || "")}</div><button data-upd>${t("updBtn")}</button><button class="x" aria-label="Close">×</button>`);
  }).catch(() => {});
}
(() => {
  const seen = store.get("seenVer", APP_V); // brand-new user: no "what's new" popup (everyone from v25 on already has seenVer)
  store.set("seenVer", APP_V);
  if (seen && seen < APP_V) fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json())
    .then(j => { const l = j.history.filter(e => e.v > seen && e.v <= APP_V); if (l.length) showWhatsNew(l); }).catch(() => {});
  checkUpdate();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
})();
</script>
